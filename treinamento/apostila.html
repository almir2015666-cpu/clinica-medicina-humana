<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Apostila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/interno.css?v=3" />
  <link rel="stylesheet" href="css/acessibilidade.css?v=1" />
  <link rel="icon" type="image/png" href="../assets/favicon.png?v=2" />
  <style>
    /* =================================================================
       A APOSTILA

       O material que o aluno consulta antes da prova e no meio do turno.
       Escrito para ser lido no CELULAR: coluna estreita, letra grande,
       linha folgada. Um texto técnico lido em tela pequena com linha
       apertada não é lido — é abandonado no terceiro parágrafo.

       Fundo claro, e não o escuro da sala de aula: aqui a pessoa lê por
       vinte minutos seguidos, e texto longo em fundo preto cansa. A sala
       de aula é escura porque lá o que importa é o vídeo.
       ================================================================= */
    /* SERIFA NO CORPO, SANS NOS TITULOS.
       É a divisão que material didático de faculdade usa, e não é gosto: a
       serifa guia o olho na linha longa de texto corrido, e é ela que o
       leitor reconhece como "livro" em vez de "site". Os títulos ficam em
       sans para se separarem do texto de longe, quando a pessoa folheia
       procurando um assunto.

       A Source Serif foi feita para tela, ao contrário das serifas de
       jornal: aguenta o celular sem fechar os traços. */
    body.apo{background:#eceff3;color:#1d2226;margin:0;
      font:400 17px/1.75 'Source Serif 4','Georgia',serif;
      -webkit-font-smoothing:antialiased}
    .apo-topo{position:sticky;top:0;z-index:60;background:var(--navy,#0a2e5c);
      color:#fff}
    .apo-topo__in{max-width:940px;margin:0 auto;padding:.7rem 1.1rem;
      display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
    .apo-topo b{font:600 .95rem 'Poppins',sans-serif;margin-right:auto;
      min-width:0;overflow-wrap:anywhere}
    .apo-topo a,.apo-topo button{border:1px solid rgba(255,255,255,.4);
      background:transparent;color:#fff;text-decoration:none;cursor:pointer;
      font:600 .82rem 'Poppins',sans-serif;padding:.45rem 1rem;
      border-radius:999px;white-space:nowrap}
    .apo-topo .destaque{background:#f5a800;border-color:#f5a800;color:#16202c}

    /* A folha imita papel: canto quase reto, sombra discreta, e uma
       LARGURA DE LINHA de leitura. 720px com letra de 17px dá algo em
       torno de 68 caracteres por linha, que é a faixa em que o olho acha o
       começo da linha seguinte sem se perder. Coluna larga demais cansa
       tanto quanto letra pequena. */
    .apo-folha{max-width:720px;margin:1.6rem auto 4rem;background:#fff;
      border-radius:3px;padding:3.4rem 3.6rem 3.6rem;
      box-shadow:0 2px 24px rgba(16,32,52,.10)}

    /* ---------------------------------------------------------- a capa */
    /* A capa começa BAIXO na folha, e não colada no topo. Numa folha de
       rosto o vazio de cima é o que dá o ar de documento: colada em cima,
       ela lê como cabeçalho de página. */
    .capa{text-align:center;padding:3.2rem 0 2.6rem;margin-bottom:0}
    .capa__inst{font:600 .74rem 'Poppins',sans-serif;letter-spacing:.19em;
      text-transform:uppercase;color:#5b6b7a}
    .capa__risco{width:52px;height:2px;background:#c9962f;margin:1.1rem auto}
    .capa__cod{font:700 .78rem 'Poppins',sans-serif;letter-spacing:.13em;
      color:#0a2e5c}
    .capa h1{font:700 1.92rem/1.28 'Source Serif 4','Georgia',serif;
      color:#0a2e5c;margin:.5rem 0 0;letter-spacing:-.01em}
    .capa__sub{font:400 italic 1rem 'Source Serif 4',serif;color:#5b6b7a;
      margin:.7rem 0 0}
    /* A ficha é um bloco de linhas curtas, cada dado na sua. Corrida, o
       registro profissional partia no meio ("CREA-BA" numa linha e o
       número na outra), e número de registro partido num material técnico
       parece erro de digitação. */
    .capa__ficha{margin:2.1rem auto 0;font:400 .85rem/1.75 'Inter',sans-serif;
      color:#4a5866;max-width:520px}
    .capa__ficha p{margin:.15rem 0}
    .capa__ficha b{color:#1d2226;font-weight:600}

    /* ==================================================================
       UMA GRAMÁTICA SÓ

       Estava com cinco ao mesmo tempo: bolinha âmbar na lista, número
       dourado no título, tabela azul de site com listras e canto redondo,
       filete cinza sobre cada seção, caixa cinza no sumário. Cada peça,
       sozinha, se defendia; juntas, o material parecia remendo.

       Aqui vale a regra do livro técnico: PRETO NO BRANCO, hierarquia
       feita por espaço e peso, e cor só onde ela informa alguma coisa. O
       ouro ficou na capa, e em nenhum outro lugar.
       ================================================================== */

    /* ------------------------------------------------------- o sumário */
    /* Sem caixa e sem fundo: dois filetes bastam. Caixa cinza é recurso de
       tela; em papel ela vira um retângulo sujo. */
    .sumario{margin:0 0 3rem;padding:1.3rem 0 1.5rem;
      border-top:1.5px solid #1d2226;border-bottom:1px solid #c8ced6}
    .sumario h2{font:600 .72rem 'Poppins',sans-serif;letter-spacing:.2em;
      text-transform:uppercase;color:#5b6b7a;margin:0 0 1rem}
    .sumario ol{list-style:none;margin:0;padding:0;
      font:400 .95rem/1.95 'Source Serif 4','Georgia',serif}
    .sumario li{margin:0;padding-left:0}
    .sumario li::before,.sumario li::marker{content:none;display:none}
    .sumario li.n2{margin-left:2.6rem;font-size:.9rem;color:#3d4650}
    /* Grade de duas colunas: os títulos alinham todos na mesma vertical,
       do "1" ao "3.1" ao "11". Com flex, cada número empurrava o seu
       título um pouco mais para o lado e a coluna saía serrilhada. */
    .sumario a{color:#1d2226;text-decoration:none;display:grid;
      grid-template-columns:2.6rem 1fr;align-items:baseline}
    .sumario a:hover{text-decoration:underline}
    .sumario .s-num{color:#5b6b7a;font-variant-numeric:tabular-nums;
      font-weight:600}

    /* --------------------------------------------------- o corpo do texto */
    /* O número fica numa coluna própria, à esquerda do título. Os títulos
       alinham na mesma vertical e dá para citar "veja 3.2". */
    .apo h2{font:600 1.2rem/1.4 'Poppins',sans-serif;color:#10233a;
      margin:2.9rem 0 .7rem;display:grid;
      grid-template-columns:2.6rem 1fr;align-items:baseline}
    .apo h2:first-child{margin-top:0}
    .apo h3{font:600 1rem/1.5 'Poppins',sans-serif;color:#10233a;
      margin:1.9rem 0 .4rem;display:grid;
      grid-template-columns:2.6rem 1fr;align-items:baseline}
    .apo .num{color:#7c8894;font-variant-numeric:tabular-nums;
      font-weight:500}

    /* Justificado com separação silábica. Justificar sem hifenizar abre
       buracos entre as palavras; com hífen, a coluna estreita fecha certo.
       O `lang` do documento é quem diz ao navegador que as regras são as
       do português. */
    .apo p{font-size:1.055rem;line-height:1.78;margin:.95rem 0;color:#1a1f24;
      text-align:justify;hyphens:auto;-webkit-hyphens:auto}
    .apo strong{color:#10233a;font-weight:600}

    /* LISTAS COM RECUO PENDENTE, que é como livro faz: o marcador fica na
       margem e a segunda linha alinha com a primeira palavra, não com o
       marcador. O marcador é um traço, e não um ponto colorido: ele
       pertence ao texto, e não à interface. */
    .apo ul{margin:1rem 0;padding:0;list-style:none}
    .apo li{position:relative;padding-left:1.5rem;font-size:1.03rem;
      line-height:1.75;margin-bottom:.5rem;color:#1a1f24}
    .apo ul>li::before{content:"–";position:absolute;left:.15rem;top:0;
      color:#7c8894;background:none;width:auto;height:auto;border-radius:0}

    /* PASSO A PASSO. Numeral simples, alinhado à direita na sua coluna,
       como em norma técnica. O disco azul virava enfeite e competia com o
       número da seção. */
    .apo ol{margin:1rem 0;padding:0;list-style:none;counter-reset:passo}
    .apo ol>li{counter-increment:passo;padding-left:2.2rem}
    .apo ol>li::before{content:counter(passo) ".";position:absolute;
      left:0;top:0;width:1.7rem;text-align:right;color:#5b6b7a;
      font-weight:600;font-variant-numeric:tabular-nums;
      background:none;height:auto;border-radius:0}

    /* O DESTAQUE: recuo e filete, como observação em livro. A caixa
       amarela era recurso de site, e na impressão em preto e branco virava
       um cinza sujo. */
    .apo blockquote{margin:1.6rem 0 1.6rem 1.5rem;
      padding:.15rem 0 .15rem 1.3rem;border-left:2px solid #b9c2cc;
      font-size:1.005rem;line-height:1.72;color:#3d4650}
    .apo blockquote strong{color:#10233a}

    /* QUADROS NO ESTILO DE PUBLICAÇÃO ACADÊMICA: três filetes horizontais
       e nada mais. Sem fundo colorido, sem listras, sem borda em volta,
       sem canto arredondado. É o desenho que livro técnico e artigo usam
       há décadas, e o motivo é prático: a grade inteira compete com os
       números, e é dos números que o leitor precisa. */
    .apo-tab{margin:1.7rem 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .apo-tab table{border-collapse:collapse;width:100%;
      min-width:min(100%,400px);
      border-top:1.5px solid #1d2226;border-bottom:1.5px solid #1d2226}
    .apo-tab th,.apo-tab td{padding:.62rem .9rem .62rem 0;text-align:left;
      vertical-align:top;line-height:1.55}
    .apo-tab th{font:600 .84rem 'Poppins',sans-serif;color:#10233a;
      border-bottom:1px solid #1d2226;padding-top:.5rem;
      padding-bottom:.5rem;white-space:nowrap}
    .apo-tab td{font-size:.985rem;color:#1a1f24}
    .apo-tab tbody tr+tr td{border-top:1px solid #eceff3}

    .apo-pe{max-width:760px;margin:0 auto 3rem;text-align:center;
      color:#5b6b7a;font-size:.85rem;padding:0 1.1rem}
    .apo-vazio{max-width:600px;margin:3rem auto;text-align:center;
      color:#5b6b7a;line-height:1.8}

    @media(max-width:640px){
      .apo-folha{margin:.9rem .7rem 3rem;padding:1.7rem 1.3rem 2.4rem;
        border-radius:6px}
      .capa h1{font-size:1.42rem}
      .capa__ficha{text-align:left}
      .apo h2{font-size:1.09rem;margin-top:2.1rem}
      .apo h3{font-size:.97rem}

      /* A COLUNA DO NÚMERO ENCOLHE. Em 360px de tela sobram cerca de 290px
         de texto; 2,6rem só para o número comem 14% da linha, e o título
         passa a quebrar em duas onde caberia numa. */
      .apo h2,.apo h3,.sumario a{grid-template-columns:1.9rem 1fr}
      .sumario li.n2{margin-left:1.3rem}
      .sumario ol{font-size:.9rem;line-height:1.85}

      /* A letra NÃO diminui no celular: é aqui que ela mais é lida.
         E o texto deixa de ser justificado: numa coluna estreita, a
         justificação abre buracos entre as palavras grandes do português
         técnico ("desenergização", "equipotencialização") e a leitura
         fica pior do que com a margem irregular. */
      .apo p{font-size:1rem;text-align:left}
      .apo li{font-size:1rem}
      .apo-topo b{flex:1 1 100%}
    }

    /* ---------------------------------------------------------- no papel */
    /* MARGEM DE LIVRO. A margem que o navegador usa sozinho é magra, e o
       texto encostava no alto da folha. 2,2cm em cima e embaixo, 2cm nos
       lados: é a faixa em que o polegar segura a folha sem tapar palavra,
       e é onde o furo do fichário entra sem comer texto. */
    @page{margin:2.2cm 2cm}

    @media print{
      .apo-topo,.a11y-fab{display:none}
      body.apo{background:#fff}
      .apo-folha{box-shadow:none;margin:0;max-width:none;padding:0;
        border-radius:0}

      /* Nada de fundo chapado a imprimir: o desenho todo é feito de filete
         e de espaço, e sai igual em qualquer impressora, inclusive na
         preto e branco da obra. As regras que mandavam imprimir o azul do
         cabeçalho da tabela e do disco do passo saíram junto com o azul. */

      /* Título órfão no pé da página é o defeito mais comum de material
         impresso: a pessoa vira a folha e o assunto começou do outro lado.
         Duas linhas junto do título resolvem. */
      .apo h2,.apo h3{break-after:avoid;break-inside:avoid}
      .apo p{orphans:2;widows:2}
      .apo blockquote,.apo li{break-inside:avoid}

      /* No papel não existe rolagem lateral: o que ficasse fora da faixa
         visível sairia cortado da folha. */
      .apo-tab{overflow:visible;break-inside:avoid}
      .apo-tab table{min-width:0}

      /* CAPA NUMA FOLHA, SUMÁRIO NA SEGUINTE, TEXTO NA TERCEIRA.
         Juntos na mesma folha, o sumário começava na metade da página e
         partia no meio de um item: metade dos capítulos numa folha e
         metade na outra, que é o defeito que mais estraga um sumário,
         porque ele existe justamente para ser visto de uma vez.
         Sozinho na folha, ele cabe inteiro com sobra.
         `break-inside` é o cinto de segurança: se um dia a apostila tiver
         seções demais para caber, ele ainda tenta manter o bloco unido. */
      .capa{break-after:page;padding:0 0 0}
      .sumario{break-inside:avoid;break-after:page;border-top:0;
        border-bottom:0;padding-top:0}

      /* SUMÁRIO EM DUAS COLUNAS NO PAPEL.
         Em coluna única ele passava da folha por poucos milímetros e o
         ÚLTIMO item ia sozinho para uma terceira página inteira. Tentei
         apertar o entrelinha e não bastou: sobrava sempre uma linha.
         Duas colunas resolvem por folga e não por ajuste fino, e é o que
         apostila impressa faz de qualquer jeito. Se a apostila crescer e
         ganhar mais dez seções, continua cabendo.
         Na tela ele fica em coluna única: lá a rolagem é de graça, e
         coluna estreita no celular quebraria os títulos longos. */
      .sumario ol{column-count:2;column-gap:2.2rem;line-height:1.6;
        font-size:.9rem}
      .sumario li{break-inside:avoid}
      .sumario li.n2{font-size:.85rem;margin-left:1.2rem}
      .sumario a{grid-template-columns:2.1rem 1fr}
    }
  </style>
</head>
<body class="apo">

  <div class="apo-topo">
    <div class="apo-topo__in">
      <b id="tituloTopo">Apostila</b>
      <button id="imprimir" class="destaque">Salvar em PDF</button>
      <a id="voltarCurso" href="painel.html">Voltar à aula</a>
    </div>
  </div>

  <div id="conteudo">
    <p class="apo-vazio">Carregando…</p>
  </div>

  <script src="js/acessibilidade.js?v=1"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    var sb = supabase.createClient(window.SUPA.url, window.SUPA.key);
    var $ = function (id) { return document.getElementById(id); };
    var busca = new URLSearchParams(location.search);
    var mat = busca.get('m');
    var amostra = busca.get('amostra');
    var cursoPedido = busca.get('curso');

    function seguro(t) {
      return String(t == null ? '' : t)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ------------------------------------------------------------ markdown
    //
    // Um interpretador PRÓPRIO e minúsculo, em vez de uma biblioteca.
    //
    // O texto vem do banco e é escrito por gente; markdown completo aceita
    // HTML embutido, e aí um material de curso viraria porta de entrada
    // para script no navegador de todo aluno. Aqui o texto é ESCAPADO
    // primeiro e só depois recebem forma os seis elementos que a apostila
    // usa. O que não estiver nesta lista sai como texto, que é o pior que
    // pode acontecer — e é inofensivo.
    function desenharMarkdown(bruto) {
      var linhas = String(bruto || '').replace(/\r/g, '').split('\n');
      var html = '', lista = '', paragrafo = [], tabela = [];

      function fecharParagrafo() {
        if (paragrafo.length) {
          html += '<p>' + enfeitar(paragrafo.join(' ')) + '</p>';
          paragrafo = [];
        }
      }
      // Uma variável para os dois tipos de lista: com `lista` guardando a
      // etiqueta aberta ('ul' ou 'ol'), trocar de bolinha para número no
      // meio do texto fecha uma e abre a outra sozinho.
      function fecharLista() {
        if (lista) { html += '</' + lista + '>'; lista = ''; }
      }

      // TABELA. Fica guardada até a linha deixar de começar com barra: só
      // então dá para saber quantas colunas ela tem e onde termina.
      //
      // A linha de tracinhos é engolida, não desenhada. Ela é a marca que
      // separa o cabeçalho do corpo — é assim que se escreve tabela em
      // markdown, e quem editar pelo admin vai escrever assim sem pensar.
      function fecharTabela() {
        if (!tabela.length) return;
        var corpo = tabela, cab = null;
        if (corpo.length > 1 && /^[\s|:-]+$/.test(corpo[1])) {
          cab = corpo[0]; corpo = corpo.slice(2);
        }
        function celulas(linha) {
          return linha.replace(/^\||\|$/g, '').split('|');
        }
        // `overflow-x` no invólucro, e não na tabela: num celular de 360px
        // um quadro de quatro colunas rola sozinho, na horizontal, sem
        // empurrar a página inteira para o lado.
        var t = '<div class="apo-tab"><table>';
        if (cab) {
          t += '<thead><tr>' + celulas(cab).map(function (c) {
            return '<th>' + enfeitar(c.trim()) + '</th>';
          }).join('') + '</tr></thead>';
        }
        t += '<tbody>' + corpo.map(function (l) {
          return '<tr>' + celulas(l).map(function (c) {
            return '<td>' + enfeitar(c.trim()) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
        html += t;
        tabela = [];
      }
      function fecharTudo() { fecharParagrafo(); fecharLista(); fecharTabela(); }

      // negrito, e mais nada. `**` é o único inline que a apostila usa.
      function enfeitar(t) {
        return seguro(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      }

      linhas.forEach(function (linha) {
        var t = linha.trim();
        if (!t) { fecharTudo(); return; }

        if (t.charAt(0) === '|') {
          fecharParagrafo(); fecharLista();
          tabela.push(t);
          return;
        }
        fecharTabela();

        if (t.indexOf('### ') === 0) {
          fecharParagrafo(); fecharLista();
          html += '<h3>' + enfeitar(t.slice(4)) + '</h3>';
        } else if (t.indexOf('## ') === 0) {
          fecharParagrafo(); fecharLista();
          html += '<h2>' + enfeitar(t.slice(3)) + '</h2>';
        } else if (t.indexOf('# ') === 0) {
          fecharParagrafo(); fecharLista();
          html += '<h2>' + enfeitar(t.slice(2)) + '</h2>';
        } else if (t.indexOf('> ') === 0 || t === '>') {
          fecharParagrafo(); fecharLista();
          html += '<blockquote>' + enfeitar(t.replace(/^>\s?/, '')) + '</blockquote>';
        } else if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0) {
          fecharParagrafo();
          if (lista !== 'ul') { fecharLista(); html += '<ul>'; lista = 'ul'; }
          html += '<li>' + enfeitar(t.slice(2)) + '</li>';
        } else if (/^\d+[.)]\s/.test(t)) {
          // Passo a passo. Numa apostila de segurança a ORDEM é o conteúdo:
          // testar o detector antes e depois, aterrar antes de tocar. Com
          // bolinha, a sequência vira sugestão.
          fecharParagrafo();
          if (lista !== 'ol') { fecharLista(); html += '<ol>'; lista = 'ol'; }
          html += '<li>' + enfeitar(t.replace(/^\d+[.)]\s+/, '')) + '</li>';
        } else {
          fecharLista();
          paragrafo.push(t);
        }
      });
      fecharTudo();
      return html;
    }

    function desenhar(curso, voltarPara) {
      $('tituloTopo').textContent = curso.titulo || 'Apostila';
      document.title = 'Apostila — ' + (curso.titulo || '');
      if (voltarPara) $('voltarCurso').href = voltarPara;

      if (!curso.apostila || !curso.apostila.trim()) {
        $('conteudo').innerHTML = '<p class="apo-vazio">A apostila deste ' +
          'módulo ainda não foi publicada.<br />O vídeo e a prova continuam ' +
          'disponíveis normalmente.</p>';
        return;
      }

      // O TÍTULO DO DOCUMENTO SAI DO TEXTO E VAI PARA A CAPA.
      // A apostila costuma começar com uma linha `# Título`, que vinha
      // virando a primeira seção e aparecia duas vezes: uma no cabeçalho e
      // outra logo abaixo, numerada como se fosse um capítulo.
      var corpo = String(curso.apostila).replace(/^\s*#[^\r\n]*(\r?\n|$)/, '');

      $('conteudo').innerHTML =
        '<article class="apo-folha">' +
          '<header class="capa">' +
            '<p class="capa__inst">Clínica Medicina Humana</p>' +
            '<div class="capa__risco"></div>' +
            '<p class="capa__cod">' + seguro(curso.codigo || '') + '</p>' +
            '<h1>' + seguro(curso.titulo || '') + '</h1>' +
            '<p class="capa__sub">Material didático de apoio</p>' +
            '<div class="capa__ficha">' +
              (curso.carga_horaria
                ? '<p><b>Carga horária:</b> ' + Number(curso.carga_horaria) +
                  ' horas</p>' : '') +
              '<p><b>Responsável técnica:</b> Anandda Fortuna Ferreira ' +
                'Lima</p>' +
              '<p>Engenheira de Segurança do Trabalho · CREA-BA 0518911586</p>' +
              '<p style="margin-top:.9rem">Camaçari, Bahia</p>' +
            '</div>' +
          '</header>' +
          '<nav class="sumario" id="sumario" aria-label="Sumário"></nav>' +
          '<div class="apo" id="corpoApo">' + desenharMarkdown(corpo) + '</div>' +
        '</article>' +
        '<p class="apo-pe">Este material é de apoio ao treinamento. Em caso ' +
        'de divergência, vale o texto da Norma Regulamentadora.</p>';

      numerarEMontarSumario();
    }

    // NUMERAR AS SEÇÕES E MONTAR O SUMÁRIO.
    //
    // Feito aqui, no documento pronto, e não com `counter` do CSS: o número
    // precisa aparecer TAMBÉM no sumário, e contador de CSS não sai da tela
    // para virar texto de link. Uma passada só resolve os dois.
    //
    // Se a apostila não tiver seção nenhuma, o sumário some em vez de ficar
    // uma caixa vazia com o título "Sumário".
    function numerarEMontarSumario() {
      var corpo = $('corpoApo'), caixa = $('sumario');
      if (!corpo || !caixa) return;
      var titulos = corpo.querySelectorAll('h2, h3');
      var c1 = 0, c2 = 0, itens = '';

      Array.prototype.forEach.call(titulos, function (h, i) {
        var num;
        if (h.tagName === 'H2') { c1 += 1; c2 = 0; num = String(c1); }
        else {
          // h3 antes de qualquer h2 não vira "0.1": fica sem número, que é
          // menos errado do que inventar um capítulo que não existe.
          if (!c1) return;
          c2 += 1; num = c1 + '.' + c2;
        }
        var id = 'sec' + i;
        h.id = id;
        h.insertAdjacentHTML('afterbegin',
          '<span class="num">' + num + '</span>');
        itens += '<li class="' + (h.tagName === 'H2' ? 'n1' : 'n2') + '">' +
          '<a href="#' + id + '"><span class="s-num">' + num + '</span>' +
          '<span>' + seguro(h.textContent.slice(num.length)) + '</span></a></li>';
      });

      if (!itens) { caixa.style.display = 'none'; return; }
      caixa.innerHTML = '<h2>Sumário</h2><ol>' + itens + '</ol>';
    }

    $('imprimir').addEventListener('click', function () { window.print(); });

    // ------------------------------------------------------------- início
    (async function () {
      // AMOSTRA: a equipe confere o material sem precisar de conta de aluno
      // AMOSTRA — só a equipe. A apostila não é mais lida direto da
      // tabela: a coluna foi fechada porque a política do catálogo é
      // pública (a vitrine precisa dela), e o material de estudo saía
      // junto para quem não tinha conta nenhuma.
      if (amostra) {
        if (!cursoPedido) {
          $('conteudo').innerHTML = '<p class="apo-vazio">Abra a amostra ' +
            'pelo admin, no curso que você quer ver.</p>';
          return;
        }
        var r = await sb.rpc('trein_apostila_curso', { p_curso: cursoPedido });
        var linha = (r.data && r.data.length) ? r.data[0] : null;
        if (r.error || !linha) {
          $('conteudo').innerHTML = '<p class="apo-vazio">Não consegui ' +
            'carregar a apostila. Entre no admin antes de abrir a amostra.</p>';
          return;
        }
        desenhar(linha, 'admin.html');
        return;
      }

      if (!mat) { location.replace('painel.html'); return; }
      var s = await sb.auth.getSession();
      if (!s.data.session) { location.replace('entrar.html'); return; }

      // A matrícula é a chave: a apostila é material do curso que a pessoa
      // comprou, e a RLS já devolve só as matrículas dela.
      // A função confere no servidor de quem é esta matrícula antes de
      // devolver o texto — a tela não é a guarda, ela só desenha.
      var r2 = await sb.rpc('trein_apostila', { p_matricula: mat });
      if (r2.error) {
        var m = String(r2.error.message || '');
        if (m.indexOf('MATRICULA_INVALIDA') >= 0
            || m.indexOf('MATRICULA_CANCELADA') >= 0) {
          location.replace('painel.html');
          return;
        }
        $('conteudo').innerHTML = '<p class="apo-vazio">Não consegui ' +
          'carregar a apostila agora. Verifique a conexão e recarregue.</p>';
        return;
      }
      var curso = (r2.data && r2.data.length) ? r2.data[0] : null;
      if (!curso) { location.replace('painel.html'); return; }
      desenhar(curso, 'curso.html?m=' + mat);
    })();
  })();
  </script>
</body>
</html>
