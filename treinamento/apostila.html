<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Apostila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/interno.css?v=3" />
  <link rel="stylesheet" href="css/acessibilidade.css?v=1" />
  <link rel="icon" type="image/png" href="../assets/favicon.png?v=2" />
  <style>
    /* =================================================================
       A APOSTILA

       O material que o aluno consulta antes da prova e no meio do turno.
       Escrito para ser lido no CELULAR: coluna estreita, letra grande,
       linha folgada. Um texto técnico lido em tela pequena com linha
       apertada não é lido — é abandonado no terceiro parágrafo.

       Fundo claro, e não o escuro da sala de aula: aqui a pessoa lê por
       vinte minutos seguidos, e texto longo em fundo preto cansa. A sala
       de aula é escura porque lá o que importa é o vídeo.
       ================================================================= */
    /* A FONTE E DECLARADA AQUI.
       Esta pagina usa class="apo", e nao "interno" — entao ela nao herda
       nada do interno.css, e o corpo do texto caia na serifa padrao do
       navegador. Num material de estudo lido no celular isso muda o
       resultado: a Inter foi escolhida por ser legivel em tela pequena. */
    body.apo{background:#f4f7fa;color:#1d2833;margin:0;
      font:400 16px/1.7 'Inter',system-ui,-apple-system,Arial,sans-serif;
      -webkit-font-smoothing:antialiased}
    .apo-topo{position:sticky;top:0;z-index:60;background:var(--navy,#0a2e5c);
      color:#fff}
    .apo-topo__in{max-width:940px;margin:0 auto;padding:.7rem 1.1rem;
      display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
    .apo-topo b{font:600 .95rem 'Poppins',sans-serif;margin-right:auto;
      min-width:0;overflow-wrap:anywhere}
    .apo-topo a,.apo-topo button{border:1px solid rgba(255,255,255,.4);
      background:transparent;color:#fff;text-decoration:none;cursor:pointer;
      font:600 .82rem 'Poppins',sans-serif;padding:.45rem 1rem;
      border-radius:999px;white-space:nowrap}
    .apo-topo .destaque{background:#f5a800;border-color:#f5a800;color:#16202c}

    .apo-folha{max-width:760px;margin:1.6rem auto 4rem;background:#fff;
      border-radius:16px;padding:2.4rem 2.6rem 3rem;
      box-shadow:0 10px 40px rgba(10,46,92,.09)}
    .apo-cab{border-bottom:2px solid #f5a800;padding-bottom:1.1rem;
      margin-bottom:1.6rem}
    .apo-cab span{display:inline-block;background:#eef3f8;color:#0a2e5c;
      font:700 .74rem 'Poppins',sans-serif;letter-spacing:.06em;
      padding:.3rem .7rem;border-radius:999px;margin-bottom:.7rem}
    .apo-cab h1{font:800 1.7rem/1.25 'Poppins',sans-serif;color:#0a2e5c;
      margin:0}
    .apo-cab p{color:#5b6b7a;font-size:.9rem;margin:.5rem 0 0}

    /* o corpo do texto */
    .apo h2{font:700 1.24rem/1.35 'Poppins',sans-serif;color:#0a2e5c;
      margin:2.2rem 0 .2rem;padding-top:.2rem}
    .apo h2:first-child{margin-top:0}
    .apo h3{font:600 1.02rem/1.4 'Poppins',sans-serif;color:#12457f;
      margin:1.5rem 0 .1rem}
    .apo p{font-size:1.02rem;line-height:1.8;margin:.85rem 0;color:#26333f}
    .apo strong{color:#0a2e5c;font-weight:600}
    .apo ul{margin:.9rem 0;padding:0;list-style:none}
    .apo li{position:relative;padding-left:1.4rem;font-size:1.02rem;
      line-height:1.75;margin-bottom:.6rem;color:#26333f}
    .apo li::before{content:"";position:absolute;left:.25rem;top:.72em;
      width:6px;height:6px;border-radius:50%;background:#f5a800}
    /* o destaque de atenção: é o que a pessoa lembra depois */
    .apo blockquote{margin:1.4rem 0;padding:1rem 1.2rem;
      background:#fff8e8;border-left:4px solid #f5a800;border-radius:0 10px 10px 0;
      font-size:1rem;line-height:1.7;color:#4a3a12}
    .apo blockquote strong{color:#7a5c00}

    .apo-pe{max-width:760px;margin:0 auto 3rem;text-align:center;
      color:#5b6b7a;font-size:.85rem;padding:0 1.1rem}
    .apo-vazio{max-width:600px;margin:3rem auto;text-align:center;
      color:#5b6b7a;line-height:1.8}

    @media(max-width:640px){
      .apo-folha{margin:.9rem .7rem 3rem;padding:1.5rem 1.3rem 2.2rem;
        border-radius:12px}
      .apo-cab h1{font-size:1.35rem}
      .apo h2{font-size:1.14rem;margin-top:1.8rem}
      /* a letra NÃO diminui no celular: é aqui que ela mais é lida */
      .apo p,.apo li{font-size:1rem}
      .apo-topo b{flex:1 1 100%}
    }

    @media print{
      .apo-topo,.a11y-fab{display:none}
      body.apo{background:#fff}
      .apo-folha{box-shadow:none;margin:0;max-width:none;padding:0}
      .apo h2{break-after:avoid}
      .apo blockquote{break-inside:avoid}
    }
  </style>
</head>
<body class="apo">

  <div class="apo-topo">
    <div class="apo-topo__in">
      <b id="tituloTopo">Apostila</b>
      <button id="imprimir" class="destaque">Salvar em PDF</button>
      <a id="voltarCurso" href="painel.html">Voltar à aula</a>
    </div>
  </div>

  <div id="conteudo">
    <p class="apo-vazio">Carregando…</p>
  </div>

  <script src="js/acessibilidade.js?v=1"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    var sb = supabase.createClient(window.SUPA.url, window.SUPA.key);
    var $ = function (id) { return document.getElementById(id); };
    var busca = new URLSearchParams(location.search);
    var mat = busca.get('m');
    var amostra = busca.get('amostra');
    var cursoPedido = busca.get('curso');

    function seguro(t) {
      return String(t == null ? '' : t)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ------------------------------------------------------------ markdown
    //
    // Um interpretador PRÓPRIO e minúsculo, em vez de uma biblioteca.
    //
    // O texto vem do banco e é escrito por gente; markdown completo aceita
    // HTML embutido, e aí um material de curso viraria porta de entrada
    // para script no navegador de todo aluno. Aqui o texto é ESCAPADO
    // primeiro e só depois recebem forma os seis elementos que a apostila
    // usa. O que não estiver nesta lista sai como texto, que é o pior que
    // pode acontecer — e é inofensivo.
    function desenharMarkdown(bruto) {
      var linhas = String(bruto || '').replace(/\r/g, '').split('\n');
      var html = '', lista = false, paragrafo = [];

      function fecharParagrafo() {
        if (paragrafo.length) {
          html += '<p>' + enfeitar(paragrafo.join(' ')) + '</p>';
          paragrafo = [];
        }
      }
      function fecharLista() {
        if (lista) { html += '</ul>'; lista = false; }
      }
      // negrito, e mais nada. `**` é o único inline que a apostila usa.
      function enfeitar(t) {
        return seguro(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      }

      linhas.forEach(function (linha) {
        var t = linha.trim();
        if (!t) { fecharParagrafo(); fecharLista(); return; }

        if (t.indexOf('### ') === 0) {
          fecharParagrafo(); fecharLista();
          html += '<h3>' + enfeitar(t.slice(4)) + '</h3>';
        } else if (t.indexOf('## ') === 0) {
          fecharParagrafo(); fecharLista();
          html += '<h2>' + enfeitar(t.slice(3)) + '</h2>';
        } else if (t.indexOf('# ') === 0) {
          fecharParagrafo(); fecharLista();
          html += '<h2>' + enfeitar(t.slice(2)) + '</h2>';
        } else if (t.indexOf('> ') === 0 || t === '>') {
          fecharParagrafo(); fecharLista();
          html += '<blockquote>' + enfeitar(t.replace(/^>\s?/, '')) + '</blockquote>';
        } else if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0) {
          fecharParagrafo();
          if (!lista) { html += '<ul>'; lista = true; }
          html += '<li>' + enfeitar(t.slice(2)) + '</li>';
        } else {
          fecharLista();
          paragrafo.push(t);
        }
      });
      fecharParagrafo(); fecharLista();
      return html;
    }

    function desenhar(curso, voltarPara) {
      $('tituloTopo').textContent = curso.titulo || 'Apostila';
      document.title = 'Apostila — ' + (curso.titulo || '');
      if (voltarPara) $('voltarCurso').href = voltarPara;

      if (!curso.apostila || !curso.apostila.trim()) {
        $('conteudo').innerHTML = '<p class="apo-vazio">A apostila deste ' +
          'módulo ainda não foi publicada.<br />O vídeo e a prova continuam ' +
          'disponíveis normalmente.</p>';
        return;
      }

      $('conteudo').innerHTML =
        '<article class="apo-folha">' +
          '<div class="apo-cab">' +
            '<span>' + seguro(curso.codigo || '') + '</span>' +
            '<h1>' + seguro(curso.titulo || '') + '</h1>' +
            '<p>Material de estudo' +
              (curso.carga_horaria ? ' · ' + Number(curso.carga_horaria) +
               ' horas' : '') +
              ' · Clínica Medicina Humana</p>' +
          '</div>' +
          '<div class="apo">' + desenharMarkdown(curso.apostila) + '</div>' +
        '</article>' +
        '<p class="apo-pe">Este material é de apoio ao treinamento. Em caso ' +
        'de divergência, vale o texto da Norma Regulamentadora.</p>';
    }

    $('imprimir').addEventListener('click', function () { window.print(); });

    // ------------------------------------------------------------- início
    (async function () {
      // AMOSTRA: a equipe confere o material sem precisar de conta de aluno
      // AMOSTRA — só a equipe. A apostila não é mais lida direto da
      // tabela: a coluna foi fechada porque a política do catálogo é
      // pública (a vitrine precisa dela), e o material de estudo saía
      // junto para quem não tinha conta nenhuma.
      if (amostra) {
        if (!cursoPedido) {
          $('conteudo').innerHTML = '<p class="apo-vazio">Abra a amostra ' +
            'pelo admin, no curso que você quer ver.</p>';
          return;
        }
        var r = await sb.rpc('trein_apostila_curso', { p_curso: cursoPedido });
        var linha = (r.data && r.data.length) ? r.data[0] : null;
        if (r.error || !linha) {
          $('conteudo').innerHTML = '<p class="apo-vazio">Não consegui ' +
            'carregar a apostila. Entre no admin antes de abrir a amostra.</p>';
          return;
        }
        desenhar(linha, 'admin.html');
        return;
      }

      if (!mat) { location.replace('painel.html'); return; }
      var s = await sb.auth.getSession();
      if (!s.data.session) { location.replace('entrar.html'); return; }

      // A matrícula é a chave: a apostila é material do curso que a pessoa
      // comprou, e a RLS já devolve só as matrículas dela.
      // A função confere no servidor de quem é esta matrícula antes de
      // devolver o texto — a tela não é a guarda, ela só desenha.
      var r2 = await sb.rpc('trein_apostila', { p_matricula: mat });
      if (r2.error) {
        var m = String(r2.error.message || '');
        if (m.indexOf('MATRICULA_INVALIDA') >= 0
            || m.indexOf('MATRICULA_CANCELADA') >= 0) {
          location.replace('painel.html');
          return;
        }
        $('conteudo').innerHTML = '<p class="apo-vazio">Não consegui ' +
          'carregar a apostila agora. Verifique a conexão e recarregue.</p>';
        return;
      }
      var curso = (r2.data && r2.data.length) ? r2.data[0] : null;
      if (!curso) { location.replace('painel.html'); return; }
      desenhar(curso, 'curso.html?m=' + mat);
    })();
  })();
  </script>
</body>
</html>
