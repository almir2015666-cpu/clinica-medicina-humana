<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Certificado | Clínica Medicina Humana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../assets/favicon.png?v=2" />
  <style>

    /* =================================================================
       O CERTIFICADO

       Formato do modelo da clínica: 960 x 540 pt, paisagem — a mesma
       medida do PDF que já é entregue hoje.

       É HTML e não PDF gerado no servidor de propósito: o navegador
       imprime em PDF com uma qualidade que nenhuma biblioteca alcança de
       graça, e o aluno salva de onde estiver. O botão Imprimir abre
       exatamente o diálogo de "Salvar como PDF".

       POR QUE ELE PRECISA SER BONITO
       Este papel é entregue ao RH de uma empreiteira, mostrado a um
       auditor e guardado numa pasta por anos. Um documento que parece
       formulário levanta dúvida antes de ser lido; um que parece diploma
       é conferido pelo código, que é o que importa. A aparência aqui não
       é enfeite — é o que faz alguém tratar o papel como documento.

       O QUE DÁ A APARÊNCIA DE DOCUMENTO, e não de folha impressa:
         - moldura dupla com cantos ornamentados, como em diploma
         - fundo com trama fina (guilhochê), como em papel de segurança
         - nome em serifa de display, que é o que o olho lê como "diploma"
         - selo circular com o código da NR e a carga horária
         - o código de conferência num quadro próprio, como um selo fiscal
       ================================================================= */
    :root{
      --navy:#0a2e5c; --navy2:#12457f; --ambar:#f5a800; --ouro:#c9962f;
      --tinta:#16202c; --fraco:#6b7885; --linha:#dfe6ee;
      --creme:#fbfaf6;
    }
    *{box-sizing:border-box}
    body{margin:0;background:#e3e9f0;color:var(--tinta);
      font:400 15px/1.6 'Inter',system-ui,Arial,sans-serif}

    /* barra de ações — some na impressão */
    .barra{position:sticky;top:0;z-index:10;background:var(--navy);
      color:#fff;padding:.9rem 1.2rem;display:flex;align-items:center;
      gap:.8rem;flex-wrap:wrap}
    .barra b{font:600 .98rem 'Poppins',sans-serif;margin-right:auto}
    .barra button,.barra a{border:0;cursor:pointer;text-decoration:none;
      font:600 .88rem 'Poppins',sans-serif;padding:.6rem 1.2rem;
      border-radius:999px}
    .imprimir{background:var(--ambar);color:#16202c}
    .voltar{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45)}
    .aviso{padding:1.2rem;text-align:center;color:#a8302f}

    /* ---------------------------------------------------------- a folha */
    .folha{width:960px;height:540px;margin:26px auto;background:var(--creme);
      position:relative;overflow:hidden;
      box-shadow:0 14px 50px rgba(10,46,92,.22)}

    /* A TRAMA DO FUNDO (guilhochê simplificado).
       Duas famílias de linhas finas cruzadas em ângulos diferentes, muito
       claras. É o que papel de segurança tem e papel de escritório não —
       o olho não distingue o desenho, mas percebe que não é folha branca.
       Fica DENTRO da moldura, senão vaza pela borda impressa. */
    .folha::before{content:"";position:absolute;inset:0;z-index:0;
      background:
        repeating-linear-gradient(58deg,
          rgba(10,46,92,.055) 0 1px, transparent 1px 9px),
        repeating-linear-gradient(-58deg,
          rgba(10,46,92,.045) 0 1px, transparent 1px 9px),
        radial-gradient(ellipse at 50% 42%,
          rgba(255,255,255,.9) 0 38%, rgba(255,255,255,0) 72%);
      pointer-events:none}

    /* A MOLDURA: faixa marinho por fora, fio ouro por dentro. */
    .moldura{position:absolute;inset:0;z-index:2;pointer-events:none;
      border:13px solid var(--navy)}
    .moldura::after{content:"";position:absolute;inset:5px;
      border:1.5px solid var(--ouro)}

    /* OS CANTOS. Quatro cantoneiras em L, douradas, por dentro do fio.
       É o detalhe que separa "borda" de "moldura": borda é uma linha,
       moldura tem canto. */
    .canto{position:absolute;width:34px;height:34px;z-index:3;
      pointer-events:none;border:0 solid var(--ouro)}
    .canto.ce{top:20px;left:20px;border-top-width:3px;border-left-width:3px}
    .canto.cd{top:20px;right:20px;border-top-width:3px;border-right-width:3px}
    .canto.be{bottom:20px;left:20px;border-bottom-width:3px;border-left-width:3px}
    .canto.bd{bottom:20px;right:20px;border-bottom-width:3px;border-right-width:3px}

    /* A marca d'água: SÓ a cruz, sem as palavras do logo.
       Cheguei a usar o logo inteiro e ficou ruim — "MEDICINA HUMANA" e o
       slogan apareciam entre as linhas do texto e sujavam a leitura. Texto
       atrás de texto nunca fica limpo. Só o símbolo resolve, e ainda
       aguenta ser impresso em preto e branco sem virar mancha. */
    .marca-agua{position:absolute;inset:0;display:flex;align-items:center;
      justify-content:center;pointer-events:none;z-index:1}
    /* Deslocada 30px para a esquerda e 6px para baixo, de propósito.
       Centralizada pela caixa, a marca PARECIA torta: os dois cubos ficam
       no alto à direita e as ondas correm embaixo, então o peso da tinta
       puxa para aquele lado. Medido: o centro de massa caía 30px à direita
       do centro da folha. Isto devolve o equilíbrio para o olho, que é o
       que importa num documento. */
    .marca-agua img{height:62%;opacity:.075;filter:grayscale(1);
      transform:translate(-30px,6px)}

    .miolo{position:absolute;inset:36px 52px;display:flex;
      flex-direction:column;z-index:4}

    /* ---------------------------------------------------------- topo */
    .topo{display:flex;align-items:center;justify-content:space-between;
      padding-bottom:.55rem;border-bottom:1px solid rgba(10,46,92,.14)}
    .topo img{height:46px}
    .selo{text-align:right;font:600 .7rem/1.45 'Poppins',sans-serif;
      color:var(--navy);letter-spacing:.06em;text-transform:uppercase}
    .selo em{display:block;font:400 .68rem 'Inter',sans-serif;
      color:var(--fraco);letter-spacing:.02em;text-transform:none;
      font-style:normal}

    /* ---------------------------------------------------------- título */
    h1{font:700 2.15rem/1 'Playfair Display','Georgia',serif;
      color:var(--navy);letter-spacing:.3em;text-align:center;
      margin:.7rem 0 0;text-indent:.3em}
    /* o risco com losangos nas pontas: o mesmo papel do fio da moldura,
       em miniatura — é o que faz a peça parecer desenhada e não montada */
    .risco{display:flex;align-items:center;justify-content:center;gap:.55rem;
      margin:.42rem auto .55rem}
    .risco i{display:block;width:74px;height:2px;background:var(--ouro)}
    .risco u{display:block;width:6px;height:6px;background:var(--ouro);
      transform:rotate(45deg);text-decoration:none}

    /* ---------------------------------------------------------- nome */
    .nome{font:600 2.1rem/1.15 'Playfair Display','Georgia',serif;
      color:var(--navy);text-align:center;margin:.1rem 0 .15rem;
      /* nome comprido não pode estourar a linha nem sair da folha */
      overflow-wrap:anywhere}
    .nome.longo{font-size:1.72rem}
    .nome.muitolongo{font-size:1.42rem}
    .cpf{text-align:center;color:var(--fraco);font-size:.86rem;
      letter-spacing:.04em;margin-bottom:.55rem}

    .texto{text-align:center;font-size:.95rem;line-height:1.72;
      max-width:770px;margin:0 auto;color:#2b3947}
    .texto b{color:var(--navy);font-weight:600}
    .cidade{text-align:center;color:var(--fraco);font-size:.86rem;
      margin-top:.75rem;font-style:italic}

    /* ------------------------------------------------- selo circular */
    /* O medalhão com o código da NR e as horas. Fica no canto direito,
       fora do caminho do texto. É o elemento que o olho procura para
       saber "de que treinamento é este papel" sem ler o parágrafo. */
    .medalha{position:absolute;right:52px;top:112px;width:96px;height:96px;
      border-radius:50%;z-index:5;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;
      background:radial-gradient(circle at 34% 30%,#fff 0 32%,#f6efdd 62%,#efe2c2 100%);
      border:2px solid var(--ouro);
      box-shadow:0 3px 10px rgba(10,46,92,.14), inset 0 0 0 4px rgba(255,255,255,.7),
                 inset 0 0 0 5.5px rgba(201,150,47,.55)}
    .medalha b{font:700 1.02rem/1 'Poppins',sans-serif;color:var(--navy);
      letter-spacing:.02em;padding:0 .2rem;overflow-wrap:anywhere}
    .medalha span{font:600 .64rem/1.3 'Poppins',sans-serif;color:var(--ouro);
      letter-spacing:.14em;text-transform:uppercase;margin-top:.15rem}
    .medalha em{font:700 .8rem/1 'Poppins',sans-serif;color:var(--navy);
      font-style:normal;margin-top:.12rem}

    /* ---------------------------------------------------- assinaturas */
    .assinaturas{margin-top:auto;display:flex;justify-content:center;
      gap:5.5rem;padding-bottom:3.1rem}
    .ass{text-align:center;min-width:240px;max-width:300px;position:relative}
    .ass hr{border:0;border-top:1.2px solid rgba(22,32,44,.55);
      margin:0 0 .35rem}
    .ass b{display:block;font:600 .88rem 'Poppins',sans-serif;
      color:var(--navy)}
    /* Quatro linhas embaixo do nome agora (dois cargos, a função e o
       registro). Com o entrelinha antigo a coluna passava por cima do
       rodapé numa folha de altura fixa. */
    .ass span{display:block;font-size:.72rem;color:var(--fraco);
      line-height:1.3}
    /* A rubrica. A altura é fixa e existe MESMO SEM IMAGEM: assim a coluna
       de quem assina e a do aluno ficam com a linha na mesma altura, e o
       certificado não muda de desenho conforme a assinatura esteja
       carregada ou não. */
    /* A rubrica NÃO ocupa altura. Ela flutua logo acima da linha, ancorada
       nela, e por isso não empurra nada.
       Medido: com ela no fluxo, mais a linha nova do segundo cargo, a coluna
       cresceu 73px numa folha de altura fixa (540pt). O texto transbordava
       o miolo e ia parar por cima do rodapé, que é posicionado pelo pé da
       folha. Fora do fluxo, o desenho volta a ser o mesmo com ou sem
       assinatura carregada. */
    .ass__rubrica{position:absolute;left:0;right:0;bottom:100%;height:52px;
      display:flex;align-items:flex-end;justify-content:center;
      pointer-events:none}
    .ass__rubrica img{max-height:52px;max-width:220px;object-fit:contain;
      /* multiply apaga o fundo branco de um escaneado comum: quem mandar
         PNG com fundo transparente ganha o mesmo resultado, e quem mandar
         JPG do papel não fica com um retângulo branco sobre a linha */
      mix-blend-mode:multiply}

    /* ------------------------------------------------------- rodapé */
    .rodape{position:absolute;left:52px;right:52px;bottom:18px;
      display:flex;justify-content:space-between;align-items:center;
      gap:1rem;font-size:.68rem;color:var(--fraco);z-index:4}
    /* O endereço do site em navy: é a assinatura visual da clínica no
       papel, e some no cinza do resto do rodapé se ficar igual. */
    .rodape__site{font:700 .72rem 'Poppins',sans-serif;color:var(--navy);
      letter-spacing:.02em}
    /* O código num quadro próprio, como selo fiscal: é o que o auditor
       digita, e ele precisa saltar do resto do rodapé. */
    .codigo{font:700 .8rem 'Consolas',monospace;color:var(--navy);
      letter-spacing:.1em;border:1.2px solid var(--ouro);
      padding:.24rem .6rem;background:rgba(255,255,255,.75);
      border-radius:3px;white-space:nowrap}
    /* O QR e o código andam juntos: quem tem câmera aponta, quem não tem
       digita. Os dois levam à mesma conferência, e o papel serve nos dois
       casos. */
    .confere{display:flex;align-items:center;gap:.5rem;position:relative}
    /* O QR flutua acima do código, na goteira direita. Fora do fluxo ele
       não tem altura, e o rodapé volta a ter a altura de uma linha de
       texto. Medido: no fluxo, ele levava o topo do rodapé de 469 para
       442px e passava por cima do registro profissional. */
    .qr{position:absolute;right:0;bottom:100%;margin-bottom:5px;
       width:46px;height:46px;line-height:0}
    .qr svg{width:46px;height:46px;display:block;shape-rendering:crispEdges}

    /* ------------------------------------- verso: conteúdo programático */
    .verso h2{font:700 1.28rem 'Playfair Display','Georgia',serif;
      color:var(--navy);text-align:center;letter-spacing:.18em;
      margin:.9rem 0 0}
    .verso ul{margin:.9rem 0 0;padding:0;list-style:none;column-count:2;
      column-gap:2.6rem}
    .verso li{position:relative;padding-left:.95rem;font-size:.82rem;
      line-height:1.58;margin-bottom:.44rem;break-inside:avoid;
      color:#2b3947}
    /* marcador losango dourado, o mesmo motivo do risco do título */
    .verso li::before{content:"";position:absolute;left:0;top:.5em;
      width:5px;height:5px;background:var(--ouro);transform:rotate(45deg)}
    /* conteúdo longo encolhe em vez de transbordar a folha */
    .verso ul.denso li{font-size:.75rem;line-height:1.48;margin-bottom:.3rem}
    .verso ul.tresc{column-count:3;column-gap:1.9rem}

    @media print{
      /* 960x540pt e paisagem: a mesma folha do modelo atual */
      @page{size:960pt 540pt;margin:0}
      body{background:#fff}
      /* SEM ISTO O NAVEGADOR DESCARTA TUDO QUE É FUNDO AO IMPRIMIR:
         a moldura marinho, o fio dourado, a trama e a marca d'água. O
         certificado sairia como texto solto numa folha branca — que é
         exatamente o que este desenho existe para não ser. */
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .barra{display:none}
      .folha{margin:0;box-shadow:none;page-break-after:always}
      .folha:last-child{page-break-after:auto}
    }

    /* Em tela estreita a folha não cabe: encolhe proporcionalmente em vez
       de criar rolagem lateral. A impressão não é afetada. */
    @media(max-width:1010px){
      .folha{transform:scale(calc((100vw - 24px) / 960));
        transform-origin:top center;
        margin-bottom:calc(26px - 540px * (1 - (100vw - 24px) / 960))}
    }
  </style>
</head>
<body>

  <div class="barra">
    <b>Certificado</b>
    <button class="imprimir" onclick="window.print()">Imprimir / Salvar em PDF</button>
    <a class="voltar" href="painel.html">Voltar</a>
  </div>

  <div id="conteudo"><p class="aviso" id="msg">Carregando…</p></div>

  <script src="../js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
  (function () {
    // =================================================================
    // Quem assina. Uma pessoa só, como a clínica pratica hoje.
    // Se mudar o responsável técnico, é aqui — uma linha.
    // =================================================================
    var INSTRUTORA = {
      nome: 'Anandda Fortuna Ferreira Lima',
      cargo: 'Engenheira de Segurança do Trabalho',
      cargo2: 'Higienista Ocupacional',
      cargo3: 'Responsável Técnica / Instrutora',
      registro: 'CREA-BA: 0518911586'
    };
    var CIDADE = 'Camaçari';
    var SITE = 'clinicamedicinahumana.com.br';

    // A imagem da assinatura, no bucket PRIVADO. Caminho fixo: o admin
    // sobrescreve este arquivo quando a responsável muda.
    //
    // Não fica no site junto com as outras imagens de propósito. Assinatura
    // escaneada em endereço público e adivinhável é assinatura que qualquer
    // um baixa e cola em qualquer papel. Aqui ela só sai para quem está
    // logado, e a página de conferência pública não a mostra: para o
    // auditor, o que prova o documento é o código.
    var ASSINATURA = 'responsavel/assinatura.png';

    // O QR LEVA DIRETO PARA A CONFERÊNCIA, com o código já preenchido.
    //
    // É o que muda o jogo contra falsificação. A imagem da assinatura não
    // protege nada: quem quer falsificar recorta a rubrica do PDF e cola
    // em outro papel, e nenhum desenho impede isso. O que denuncia a
    // fraude é a consulta: se o nome do papel não bate com o nome que o
    // site devolve, o documento é falso, e não há como falsificar a
    // resposta do servidor da clínica.
    //
    // Só que conferência que dá trabalho não é feita. Digitar um código de
    // catorze caracteres a mão é trabalho; apontar a câmera não é. O QR
    // existe para tirar a desculpa de não conferir.
    function qrDoCodigo(codigo) {
      try {
        if (typeof qrcode !== 'function') return '';
        // Correção M, e não H. H aguenta mais estrago no papel, mas exige
        // mais módulos para o mesmo endereço, e módulo menor no espaço que
        // o rodapé permite é o que de fato impede a câmera de ler. Entre
        // resistir a mancha e ser legível, legível ganha.
        var q = qrcode(0, 'M');
        q.addData('https://' + SITE + '/treinamento/validar.html?c=' + codigo);
        q.make();
        return q.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
      } catch (e) {
        // Sem QR o certificado continua válido: o código impresso e a
        // página de conferência não dependem dele.
        return '';
      }
    }

    // Se não houver imagem, o certificado sai com a linha em branco, para
    // assinar à mão. Nunca sai quebrado nem com um ícone de imagem faltando.
    var urlAssinatura = null;
    async function buscarAssinatura() {
      try {
        var r = await sb.storage.from('treinamentos')
          .createSignedUrl(ASSINATURA, 60 * 10);
        if (!r.error && r.data && r.data.signedUrl) urlAssinatura = r.data.signedUrl;
      } catch (e) { urlAssinatura = null; }
    }

    var sb = supabase.createClient(window.SUPA.url, window.SUPA.key);
    var alvo = document.getElementById('conteudo');

    var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
                 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

    function porExtenso(iso) {
      var p = String(iso).slice(0, 10).split('-');
      if (p.length !== 3) return '';
      return Number(p[2]) + ' de ' + MESES[Number(p[1]) - 1] + ' de ' + p[0];
    }
    function dataBr(iso) {
      var p = String(iso || '').slice(0, 10).split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : '';
    }
    function cpfBonito(n) {
      n = String(n || '').replace(/\D/g, '');
      return n.length === 11
        ? n.slice(0,3)+'.'+n.slice(3,6)+'.'+n.slice(6,9)+'-'+n.slice(9) : n;
    }
    // Escapa tambem aspas. Hoje tudo daqui vai para no de texto, onde aspa
    // e inofensiva — mas o admin ja teve de aprender essa licao por bug
    // real (um titulo com aspas truncava o campo e o proximo Salvar
    // gravava o pedaco por cima), e este arquivo imprime os mesmos campos.
    function seguro(t) {
      return String(t == null ? '' : t)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function erro(txt) {
      alvo.innerHTML = '<p class="aviso">' + txt + '</p>';
    }

    // O risco com losangos nas pontas. Repetido no titulo e no verso: e o
    // mesmo motivo do canto da moldura, em miniatura — e o que faz a peca
    // parecer desenhada por uma pessoa, e nao montada por um programa.
    function risco() {
      return '<div class="risco"><u></u><i></i><u></u><i></i><u></u></div>';
    }

    // O medalhao com o codigo da NR e a carga horaria. Fica no canto
    // direito, fora do caminho do texto: e onde o olho procura para saber
    // de que treinamento e o papel sem ler o paragrafo inteiro.
    function medalha(d) {
      var cod = d.curso.codigo || '';
      var h = d.curso.carga_horaria;
      if (!cod && !h) return '';
      return '<div class="medalha">' +
        (cod ? '<b>' + seguro(cod) + '</b>' : '') +
        '<span>carga</span>' +
        (h ? '<em>' + Number(h) + 'h</em>' : '<em>—</em>') +
        '</div>';
    }

    function folhaFrente(d) {
      var horas = d.curso.carga_horaria
        ? d.curso.carga_horaria + (d.curso.carga_horaria === 1 ? ' hora' : ' horas')
        : '';
      var titulo = d.curso.titulo_certificado || d.curso.titulo;
      var deQuem = d.aluno.empresa
        ? ', da empresa <b>' + seguro(d.aluno.empresa) + '</b>' : '';

      // Nome comprido não pode estourar a folha nem virar duas linhas
      // gigantes. Três degraus, escolhidos pelo tamanho do nome — e
      // "Wesley da Purificação Silva" não é um caso raro por aqui.
      var nome = String(d.aluno.nome || '');
      var classeNome = nome.length > 42 ? ' muitolongo'
                     : nome.length > 30 ? ' longo' : '';

      return '' +
      '<div class="folha">' +
        '<div class="moldura"></div>' +
        '<span class="canto ce"></span><span class="canto cd"></span>' +
        '<span class="canto be"></span><span class="canto bd"></span>' +
        '<div class="marca-agua"><img src="img/marca-agua.png" alt="" /></div>' +
        medalha(d) +
        '<div class="miolo">' +
        '<div class="topo">' +
          '<img src="img/logo.png" alt="Clínica Medicina Humana" />' +
          '<div class="selo">Clínica Medicina Humana' +
            '<em>Treinamentos em Normas Regulamentadoras</em></div>' +
        '</div>' +
        '<h1>CERTIFICADO</h1>' + risco() +
        '<div class="nome' + classeNome + '">' + seguro(d.aluno.nome) + '</div>' +
        '<div class="cpf">CPF ' + cpfBonito(d.aluno.cpf) + '</div>' +
        '<p class="texto">Certificamos para os devidos fins que ' +
          '<b>' + seguro(d.aluno.nome) + '</b>, portador do CPF ' +
          cpfBonito(d.aluno.cpf) + ', participou do treinamento de ' +
          '<b>' + seguro(titulo) + '</b>' +
          (horas ? ', com carga horária de <b>' + horas + '</b>' : '') +
          deQuem + '.' +
          (d.cert.valido_ate
            ? ' Válido até <b>' + dataBr(d.cert.valido_ate) + '</b>.' : '') +
        '</p>' +
        '<p class="cidade">' + CIDADE + ', ' + porExtenso(d.cert.emitido_em) + '.</p>' +
        '<div class="assinaturas">' +
          '<div class="ass">' +
            // A rubrica fica ACIMA da linha, encostada nela, como assinatura
            // de verdade. O espaço é reservado esteja ela lá ou não, senão a
            // coluna da esquerda sobe e as duas linhas ficam desalinhadas.
            '<div class="ass__rubrica">' +
              (urlAssinatura
                ? '<img src="' + urlAssinatura + '" alt="" />' : '') +
            '</div><hr /><b>' + INSTRUTORA.nome + '</b>' +
            '<span>' + INSTRUTORA.cargo + '</span>' +
            '<span>' + INSTRUTORA.cargo2 + '</span>' +
            '<span>' + INSTRUTORA.cargo3 + '</span>' +
            '<span>' + INSTRUTORA.registro + '</span></div>' +
          '<div class="ass"><div class="ass__rubrica"></div><hr /><b>' +
            seguro(d.aluno.nome) + '</b>' +
            '<span>Colaborador</span>' +
            '<span>CPF: ' + cpfBonito(d.aluno.cpf) + '</span></div>' +
        '</div>' +
        '<div class="rodape">' +
          '<span><b class="rodape__site">' + SITE + '</b></span>' +
          '<span>Aponte a câmera para o código ao lado, ou confira em ' +
            SITE + '/treinamento/validar.html</span>' +
          '<span class="confere">' +
            '<i class="qr">' + qrDoCodigo(d.cert.codigo) + '</i>' +
            '<b class="codigo">' + seguro(d.cert.codigo) + '</b>' +
          '</span>' +
        '</div>' +
      '</div></div>';
    }

    function folhaVerso(d) {
      // curso sem conteúdo cadastrado sai com uma página só: melhor uma
      // frente correta do que um verso inventado
      var bruto = d.curso.conteudo_programatico;
      if (!bruto || !bruto.trim()) return '';
      var itens = bruto.split('\n').map(function (l) { return l.trim(); })
                       .filter(Boolean)
                       .map(function (l) { return '<li>' + seguro(l) + '</li>'; })
                       .join('');
      // Conteúdo longo não pode transbordar a folha: não existe "próxima
      // página" num certificado de 960x540. Então ele se ajusta — mais
      // colunas e letra menor — em vez de sumir pela borda de baixo.
      var quantos = bruto.split('\n').filter(function (l) { return l.trim(); }).length;
      var comprido = bruto.replace(/\s+/g, ' ').length;
      var classe = '';
      if (quantos > 16 || comprido > 1400) classe = 'denso';
      if (quantos > 26 || comprido > 2200) classe = 'denso tresc';

      return '' +
      '<div class="folha">' +
        '<div class="moldura"></div>' +
        '<span class="canto ce"></span><span class="canto cd"></span>' +
        '<span class="canto be"></span><span class="canto bd"></span>' +
        '<div class="marca-agua"><img src="img/marca-agua.png" alt="" /></div>' +
        medalha(d) +
        '<div class="miolo verso">' +
        '<div class="topo">' +
          '<img src="img/logo.png" alt="Clínica Medicina Humana" />' +
          '<div class="selo">' + seguro(d.curso.titulo || '') +
            '<em>' + seguro(d.curso.codigo || '') +
            (d.curso.carga_horaria ? ' · ' + d.curso.carga_horaria + ' horas' : '') +
            '</em></div>' +
        '</div>' +
        '<h2>CONTEÚDO PROGRAMÁTICO</h2>' + risco() +
        '<ul class="' + classe + '">' + itens + '</ul>' +
        '<div class="rodape"><span>' + seguro(d.aluno.nome) + '</span>' +
          '<span class="codigo">' + seguro(d.cert.codigo) + '</span></div>' +
      '</div></div>';
    }

    // Amostra: ?amostra=1 desenha o certificado com dados de exemplo, sem
    // tocar no banco. Serve para conferir o desenho e para ajustar o texto
    // antes de existir aluno aprovado. Não emite nada nem vale como
    // documento — sai marcado como AMOSTRA no rodapé.
    var AMOSTRA = {
      cert: { codigo: 'AMOSTRA-0000', emitido_em: new Date().toISOString(),
              valido_ate: null },
      aluno: { nome: 'Wesley da Purificação Silva', cpf: '07442195580',
               empresa: 'CONSTRUTORA EXEMPLO LTDA' },
      curso: { codigo: 'NR-20', carga_horaria: 8,
               titulo: 'Inflamáveis e combustíveis',
               titulo_certificado: 'NR-20: Segurança e Saúde no Trabalho com '
                 + 'Inflamáveis e Combustíveis, Módulo Intermediário',
               conteudo_programatico:
'Inflamáveis: características, propriedades, perigos e risco.\n' +
'Controle coletivo e individual para trabalhos com inflamáveis. EPI e EPC.\n' +
'Fontes de ignição e seu controle.\n' +
'Proteção contra incêndio com inflamáveis.\n' +
'Procedimento em situações de emergência com inflamáveis.\n' +
'Estudo detalhado da NR-20 e sua interação com outras normas, incluindo a ' +
'revisão do item 20.8.8, sobre trabalhos que gerem chamas, calor ou ' +
'centelhas; em ' +
'espaços confinados conforme a NR-33; em locais com risco de queda conforme ' +
'a NR-35; e com equipamentos elétricos de acordo com a NR-10.\n' +
'Análise preliminar de riscos e perigos, e permissões de trabalho.\n' +
'Práticas de prevenção e combate a incêndio.\n' +
'Práticas de APR, RCP, desmaio, convulsões, fraturas, imobilização, ' +
'queimaduras, hemorragias, resgate e transporte.\n' +
'Equipamentos de proteção respiratória.' }
    };

    (async function () {
      var busca = new URLSearchParams(location.search);
      if (busca.get('amostra')) {
        // `?amostra=1&curso=<id>` desenha a amostra com o TEXTO DAQUELE
        // curso — título do certificado, carga horária e conteúdo
        // programático como estão gravados agora. É assim que a
        // administração confere o que escreveu antes de existir aluno
        // aprovado; sem o curso, cai no exemplo de NR-20.
        var qual = busca.get('curso');
        var amostra = AMOSTRA;
        if (qual) {
          var c = (await sb.from('trein_curso')
            .select('codigo,titulo,titulo_certificado,carga_horaria,' +
                    'conteudo_programatico')
            .eq('id', qual).maybeSingle()).data;
          if (c) {
            amostra = { cert: AMOSTRA.cert, aluno: AMOSTRA.aluno, curso: c };
          }
        }
        await buscarAssinatura();
        alvo.innerHTML = folhaFrente(amostra) + folhaVerso(amostra);
        document.title = 'Certificado (amostra)';
        document.querySelectorAll('.rodape span:nth-child(2)').forEach(
          function (s) { s.textContent = 'AMOSTRA: não é documento válido'; });
        if (qual && amostra === AMOSTRA) {
          alvo.insertAdjacentHTML('afterbegin', '<p class="aviso">Não achei ' +
            'esse curso — o desenho abaixo é o exemplo de NR-20.</p>');
        }
        return;
      }

      var mat = busca.get('m');
      if (!mat) return erro('Falta dizer qual curso. Volte e escolha na sua lista.');

      var sessao = await sb.auth.getSession();
      if (!sessao.data.session) {
        return erro('Entre com o seu CPF para ver o certificado. ' +
                    '<a href="entrar.html">Ir para o login</a>.');
      }

      // emite (ou devolve o que já existe). É o banco que confere se passou.
      var em = await sb.rpc('trein_emitir_certificado', { p_matricula: mat });
      if (em.error) {
        var m = em.error.message || '';
        if (m.indexOf('NAO_APROVADO') !== -1) {
          return erro('O certificado sai depois de você ser aprovado na prova.');
        }
        if (m.indexOf('MATRICULA_CANCELADA') !== -1) {
          return erro('Este treinamento foi cancelado. Fale com o RH da sua empresa.');
        }
        if (m.indexOf('MATRICULA_VENCIDA') !== -1) {
          return erro('O prazo deste treinamento venceu antes de o certificado ' +
                      'ser emitido. Fale com o RH da sua empresa.');
        }
        return erro('Não consegui emitir o certificado. Tente de novo mais tarde.');
      }

      var r = await sb.from('trein_matricula')
        .select('id,trein_curso(codigo,titulo,titulo_certificado,' +
                'carga_horaria,conteudo_programatico)')
        .eq('id', mat).maybeSingle();
      var perfil = await sb.from('trein_aluno')
        .select('nome,cpf,empresa').eq('id', sessao.data.session.user.id)
        .maybeSingle();

      if (!r.data || !perfil.data) return erro('Não encontrei esse certificado.');

      // O PAPEL SAI DO RETRATO CONGELADO NO DIA DA EMISSAO.
      //
      // A validacao publica ja le o retrato gravado em trein_certificado.
      // Se a impressao continuasse lendo os dados AO VIVO, bastaria alguem
      // corrigir a carga horaria de 8 para 4 no admin para todo certificado
      // ja emitido reimprimir como 4 horas — enquanto a pagina de validacao
      // continuaria dizendo 8. O auditor confere o papel e nao bate.
      //
      // O ao vivo fica so como reserva, para certificado emitido antes de o
      // retrato existir.
      var congelado = em.data || {};
      var cursoVivo = (r.data && r.data.trein_curso) || {};
      var d = {
        cert: congelado,
        curso: {
          codigo: cursoVivo.codigo,
          titulo: congelado.curso_titulo || cursoVivo.titulo,
          // NAO vem ao vivo. O 20-consertos-de-seguranca.sql congelou o
          // titulo em trein_certificado justamente para o papel dizer o
          // mesmo que a pagina publica de conferencia. Lido ao vivo, e com
          // precedencia sobre o congelado, uma correcao de virgula no
          // admin reescrevia TODO certificado ja emitido — e a validacao
          // continuava mostrando o texto antigo. O auditor confere e nao
          // bate.
          //
          // So vale para certificado emitido ANTES de o retrato existir,
          // onde nao ha congelado nenhum.
          titulo_certificado: congelado.curso_titulo
                              ? null : cursoVivo.titulo_certificado,
          carga_horaria: (congelado.carga_horaria != null
                          ? congelado.carga_horaria : cursoVivo.carga_horaria),
          // o conteudo programatico e do CURSO, nao do aluno: ele descreve
          // a ementa e pode ser corrigido sem invalidar papel nenhum
          conteudo_programatico: cursoVivo.conteudo_programatico
        },
        aluno: {
          nome:    congelado.nome    || perfil.data.nome,
          cpf:     congelado.cpf     || perfil.data.cpf,
          empresa: congelado.empresa || perfil.data.empresa
        }
      };
      await buscarAssinatura();
      alvo.innerHTML = folhaFrente(d) + folhaVerso(d);
      document.title = 'Certificado de ' + d.aluno.nome;
    })();
  })();
  </script>
</body>
</html>
