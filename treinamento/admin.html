<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Aulas e vídeos | Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/interno.css?v=3" />
  <link rel="icon" type="image/png" href="../assets/favicon.png?v=2" />
  <style>
    /* =================================================================
       Só a equipe da clínica entra aqui. Usa o tema escuro da área
       interna para não ter uma terceira cara no projeto — e os cursos
       aparecem em cartões no meio, iguais aos do aluno, para você ver a
       plataforma do mesmo jeito que ela é vista do outro lado.
       ================================================================= */
    .adm{padding:3rem 0 4rem}
    .adm__cab{margin-bottom:2rem}
    .adm__cab h1{font-size:clamp(1.5rem,3vw,2.1rem)}
    .adm__cab p{color:var(--meio);margin:.6rem 0 0}

    /* o cartão do curso: o número de aulas é o que importa aqui, então
       ele vem grande. Sem vídeo é um problema, e tem de gritar. */
    .cadm{position:relative;background:var(--carvao);
      border:1px solid var(--linha-i);border-radius:16px;padding:1.5rem 1.4rem;
      cursor:pointer;display:flex;flex-direction:column;min-height:180px;
      transition:transform .3s cubic-bezier(.22,.61,.36,1),border-color .3s,
      box-shadow .3s;text-align:left;font:inherit;color:inherit;width:100%}
    .cadm:hover{transform:translateY(-6px);border-color:var(--ambar);
      box-shadow:0 18px 44px rgba(0,0,0,.5)}
    .cadm__tag{align-self:flex-start;background:var(--carvao2);
      color:var(--ambar);border:1px solid var(--linha-i);
      font:700 .74rem 'Poppins',sans-serif;letter-spacing:.05em;
      padding:.3rem .66rem;border-radius:999px;margin-bottom:.85rem}
    .cadm h3{font-size:1.06rem;margin-bottom:.35rem}
    .cadm p{color:var(--meio);font-size:.86rem;margin:0}
    .cadm__pe{margin-top:auto;padding-top:1rem;display:flex;
      align-items:baseline;gap:.5rem}
    .cadm__n{font:800 1.9rem/1 'Poppins',sans-serif;color:var(--claro)}
    .cadm__n.zero{color:var(--vermelho)}
    .cadm__un{font-size:.84rem;color:var(--meio)}
    .cadm__ir{margin-left:auto;color:var(--ambar);
      font:600 .88rem 'Poppins',sans-serif}
    .cadm.inativo{opacity:.5}

    .voltar{border:1px solid var(--linha-i);background:transparent;
      color:var(--claro);cursor:pointer;font:600 .85rem 'Poppins',sans-serif;
      padding:.5rem 1.1rem;border-radius:999px;margin-bottom:1.4rem}
    .voltar:hover{border-color:var(--ambar);color:var(--ambar)}

    .aulaadm{background:var(--carvao);border:1px solid var(--linha-i);
      border-radius:12px;padding:1.05rem 1.2rem;margin-bottom:.7rem;
      display:flex;align-items:center;gap:1rem}
    .aulaadm__n{width:28px;height:28px;border-radius:50%;flex-shrink:0;
      background:var(--carvao2);border:1px solid var(--linha-i);
      display:flex;align-items:center;justify-content:center;
      font:700 .78rem 'Poppins',sans-serif;color:var(--meio)}
    .aulaadm__txt{flex:1;min-width:0}
    .aulaadm__txt b{display:block;color:var(--claro);font-weight:500;
      font-size:.95rem}
    .aulaadm__txt span{font-size:.8rem;color:var(--meio)}
    .aulaadm__txt span.sem{color:var(--vermelho)}
    .aulaadm__acoes{display:flex;gap:.4rem;flex-shrink:0}
    .mini{border:1px solid var(--linha-i);background:transparent;
      color:var(--claro);cursor:pointer;font:600 .78rem 'Poppins',sans-serif;
      padding:.4rem .78rem;border-radius:999px}
    .mini:hover{border-color:var(--ambar);color:var(--ambar)}
    .mini.perigo:hover{border-color:var(--vermelho);color:var(--vermelho)}

    /* uma questão da prova: enunciado em cima, alternativas embaixo, e a
       certa marcada em verde. Ver o gabarito de olho é o ponto — é assim
       que o responsável técnico confere a prova sem abrir o Supabase. */
    .qadm{background:var(--preto);border:1px solid var(--linha-i);
      border-radius:12px;padding:1rem 1.1rem;margin-bottom:.7rem}
    .qadm__cab{display:flex;align-items:flex-start;gap:1rem}
    .qadm__en{flex:1;min-width:0;color:var(--claro);font-size:.94rem;
      line-height:1.55}
    .qadm ol{list-style:none;margin:.7rem 0 0 2.5rem;padding:0}
    .qadm li{font-size:.85rem;color:var(--meio);padding:.16rem 0;
      line-height:1.5}
    .qadm li.certa{color:var(--verde);font-weight:600}
    .qadm li b{color:var(--claro);font-weight:700}
    .qadm li.certa b{color:var(--verde)}

    .form-aula{background:var(--carvao);border:1px solid var(--linha-i);
      border-radius:12px;padding:1.5rem;margin-top:1.6rem}
    .form-aula h3{font-size:1.02rem;margin-bottom:1rem}
    .form-aula label{display:block;font-size:.82rem;font-weight:600;
      color:var(--claro);margin:.9rem 0 .35rem}
    .form-aula input[type=text],.form-aula textarea{
      width:100%;padding:.7rem .9rem;border:1px solid var(--linha-i);
      border-radius:9px;background:var(--preto);color:var(--claro);
      font:400 .92rem 'Inter',sans-serif}
    .form-aula textarea{min-height:70px;resize:vertical}
    .form-aula input[type=file]{width:100%;color:var(--meio);font-size:.88rem;
      padding:.7rem 0}
    .linha2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .linha-aula{border:1px solid var(--linha-i);border-radius:10px;
      padding:.9rem 1rem 1.1rem;margin-bottom:.8rem;background:var(--preto)}
    .linha-aula__cab{display:flex;align-items:center;justify-content:space-between;
      margin-bottom:.2rem}
    .linha-aula__cab b{font:700 .9rem 'Poppins',sans-serif;color:var(--ambar)}
    .linha-aula label:first-of-type{margin-top:.5rem}
    .qadm--ruim{border-color:var(--vermelho)}
    .qadm__alerta{background:rgba(239,106,104,.12);color:var(--vermelho);
      font:600 .8rem/1.45 'Poppins',sans-serif;padding:.5rem .7rem;
      border-radius:8px;margin:-.2rem 0 .7rem}
    .prog{height:6px;border-radius:3px;background:var(--carvao2);
      overflow:hidden;margin-top:.7rem;display:none}
    .prog i{display:block;height:100%;background:var(--ambar);width:0;
      transition:width .3s}
    .msg{margin-top:1rem;padding:.8rem 1rem;border-radius:9px;font-size:.88rem;
      display:none;line-height:1.6}
    .msg.bom{background:rgba(53,196,122,.12);color:var(--verde)}
    .msg.ruim{background:rgba(239,106,104,.12);color:var(--vermelho)}
    .login-adm{max-width:400px;margin:5rem auto;background:var(--carvao);
      border:1px solid var(--linha-i);border-radius:14px;padding:2rem}
    .login-adm input{width:100%;padding:.7rem .9rem;
      border:1px solid var(--linha-i);border-radius:9px;background:var(--preto);
      color:var(--claro);font:400 .92rem 'Inter',sans-serif}
    .login-adm label{display:block;font-size:.82rem;font-weight:600;
      color:var(--claro);margin:.9rem 0 .35rem}
  </style>
</head>
<body class="interno">

  <header class="i-topo">
    <div class="i-container i-topo__in">
      <a class="i-marca" href="admin.html">
        <img src="img/logo.png" alt="Clínica Medicina Humana" />
        <span><b>Medicina Humana</b><span>Administração</span></span>
      </a>
      <div class="i-topo__dir">
        <span class="i-quem" id="quem"></span>
        <button class="i-sair" id="sair" style="display:none">Sair</button>
      </div>
    </div>
  </header>

  <!-- login da equipe -->
  <div id="viewLogin" style="display:none">
    <div class="login-adm">
      <h2 style="font-size:1.2rem;margin-bottom:.4rem">Administração</h2>
      <p style="color:var(--meio);font-size:.9rem;margin:0 0 1.2rem">
        Entre com o seu usuário e senha do SistemaCMH.</p>
      <label for="u">Usuário</label>
      <input id="u" type="text" autocomplete="username" placeholder="ex.: admin" />
      <label for="p">Senha</label>
      <input id="p" type="password" autocomplete="current-password" />
      <div class="msg ruim" id="erroLogin"></div>
      <button class="i-botao" id="btnEntrar" style="width:100%;margin-top:1.2rem">
        Entrar</button>
    </div>
  </div>

  <!-- os cursos, no meio -->
  <main class="adm" id="viewAdm" style="display:none">
    <div class="i-container">
      <div id="painelCursos">
        <div class="adm__cab">
          <h1>Cursos</h1>
          <p>Clique num curso para ver as aulas dele e subir os vídeos.</p>
        </div>
        <div class="modulos" id="grade"></div>
      </div>

      <div id="painelAulas" style="display:none">
        <button class="voltar" id="voltar">← Cursos</button>
        <div id="corpo"></div>
      </div>
    </div>
  </main>

  <script src="../js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    var sb = supabase.createClient(window.SUPA.url, window.SUPA.key);
    var $ = function (id) { return document.getElementById(id); };
    var cursos = [], porCurso = {}, atual = null;
    var questoes = [], provaAberta = false;   // o banco de questões do curso
    var semApostila = false;   // a coluna ainda nao existe no banco
    var linhasAula = 0;         // quantas linhas de aula estao na tela
    var questoesBaseAula = 0;  // quantas aulas o curso ja tem
    var alvoDoAviso = null;   // em qual caixa a proxima mensagem aparece
    var quemSou = null;       // a linha de orc_usuarios de quem entrou

    // 2 GB é o teto de um upload direto no Storage do Supabase. Aula de
    // treinamento passa longe disso, mas avisar antes é melhor do que a
    // pessoa esperar meia hora para o envio falhar no fim.
    var LIMITE = 2 * 1024 * 1024 * 1024;

    // Escapa TAMBEM as aspas. Ate aqui tudo ia para no de texto, onde
    // aspa e inofensiva; o formulario de dados do curso poe o titulo
    // dentro de value="...", e ai um titulo legitimo como
    // Reciclagem "NR-35" fecha o atributo na primeira aspa: o campo
    // aparece truncado e o proximo "Salvar" grava o pedaco por cima do
    // titulo bom. Perda de dado sem atacante nenhum, num texto que sai
    // impresso no certificado.
    function seguro(t) {
      return String(t == null ? '' : t)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function relogio(s) {
      s = Math.floor(s || 0);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }
    function recado(el, texto, bom) {
      if (!el) return;
      el.className = 'msg ' + (bom ? 'bom' : 'ruim');
      el.style.display = texto ? 'block' : 'none';
      el.innerHTML = texto;
    }

    // ------------------------------------------------------------- entrar
    $('btnEntrar').addEventListener('click', entrar);
    $('p').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') entrar();
    });
    $('u').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('p').focus();
    });

    async function entrar() {
      // TEM de bater com o `normalizar()` do SistemaCMH: lá o acento é
      // retirado da letra (josé -> jose) antes de a pontuação cair. Aqui,
      // filtrar direto por [^a-z0-9] comeria o "é" inteiro e viraria "jos",
      // que é um usuário que não existe — login recusado sem explicação.
      var login = $('u').value.trim()
        .normalize('NFKD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!login) return recado($('erroLogin'), 'Digite o usuário.');
      var r = await sb.auth.signInWithPassword({
        // o mesmo domínio interno que o SistemaCMH usa
        email: login + '@orcamentos.clinicamedicinahumana.com.br',
        password: $('p').value
      });
      if (r.error) return recado($('erroLogin'), 'Usuário ou senha incorretos.');
      abrir();
    }

    $('sair').addEventListener('click', async function () {
      await sb.auth.signOut(); location.reload();
    });

    // A PERMISSAO E CONFERIDA SEMPRE, NAO SO NA ENTRADA.
    //
    // Conferir uma vez no login nao basta: o modulo Treinamentos pode ser
    // dado — e TIRADO — no SistemaCMH a qualquer momento, e quem estivesse
    // com esta tela aberta continuaria mexendo por horas depois de perder
    // o acesso. O banco ja recusa (a RLS le trein_is_equipe() a cada
    // pedido), mas recusar em silencio faz a tela mentir: os cursos
    // apareceriam com "0 aulas" e as remocoes falhariam sem explicacao.
    //
    // Entao a cada abertura de curso a pergunta e refeita. Custa um pedido
    // pequeno e evita a pessoa trabalhar num painel que nao grava nada.
    // Devolve a pessoa quando ela pode; `false` quando NÃO pode; e a
    // string 'erro' quando NÃO FOI POSSÍVEL PERGUNTAR.
    //
    // Os três são estados diferentes, e tratá-los como dois causava o pior
    // efeito possível: um soluço de rede fazia o supabase-js devolver
    // {data:null, error}, isso virava "não pode", e a tela DESLOGAVA o
    // administrador dizendo que o acesso dele tinha sido retirado — logo
    // depois de a gravação ter dado certo. Ele acreditava que perdera a
    // permissão e que o trabalho se perdera; as duas coisas falsas.
    async function podeAdministrar() {
      var s = await sb.auth.getSession();
      if (!s.data.session) return false;
      var r = await sb.from('orc_usuarios')
        .select('usuario,nome,ativo,admin,modulos')
        .eq('id', s.data.session.user.id).maybeSingle();
      if (r.error) return 'erro';
      var eu = r.data;
      if (!eu || !eu.ativo) return false;
      if (eu.admin) return eu;
      // igualdade exata, como o `= any(u.modulos)` do banco. Com
      // `indexOf` numa string, um módulo chamado "treinamentos" passaria
      // aqui e seria recusado lá — o desencontro que este código existe
      // justamente para evitar.
      var m = eu.modulos;
      var lista = Array.isArray(m) ? m
                : String(m || '').replace(/[{}"]/g, '').split(',');
      var tem = lista.some(function (x) { return String(x).trim() === 'treinamento'; });
      return tem ? eu : false;
    }

    // ---------------------------------------------------- o log da clinica
    //
    // Toda alteracao feita aqui vai para a MESMA tabela de log do
    // SistemaCMH (orc_log), lida na tela de Registros. Um vídeo apagado ou
    // uma carga horaria trocada precisa ter dono e hora — e o lugar de
    // procurar isso ja existe; criar um log separado so para o site seria
    // ter dois lugares para olhar, e ninguem olha os dois.
    //
    // `maquina` diz de onde veio, para nao se confundir com o programa: no
    // SistemaCMH esse campo traz o nome do computador.
    async function anotar(acao, detalhe) {
      try {
        var s = await sb.auth.getSession();
        if (!s.data.session) return;
        var eu = quemSou || {};
        await sb.from('orc_log').insert({
          usuario_id: s.data.session.user.id,
          usuario_login: eu.usuario || null,
          usuario_nome: eu.nome || null,
          acao: acao,
          detalhe: detalhe || null,
          maquina: 'site/treinamento',
          app_versao: 'admin-web',
          usuario_windows: null,
          ip_local: null, ip_publico: null,
          localizacao: (navigator.language || '') + ' · ' +
                       (Intl.DateTimeFormat().resolvedOptions().timeZone || '')
        });
      } catch (e) {
        // log nunca atrapalha o trabalho: se falhar, a acao ja aconteceu
      }
    }

    async function perdeuOAcesso() {
      await sb.auth.signOut();
      $('viewAdm').style.display = 'none';
      $('sair').style.display = 'none';
      $('quem').textContent = '';
      $('viewLogin').style.display = 'block';
      recado($('erroLogin'),
        'O seu acesso a administracao de treinamentos foi retirado. '
        + 'Fale com o administrador do SistemaCMH.');
    }

    async function abrir() {
      var u = (await sb.auth.getUser()).data.user;
      // quem entrou é mesmo da equipe? A RLS já barraria a gravação, mas
      // deixar a tela abrir para quem não pode salvar é enganar a pessoa.
      var eu = await podeAdministrar();
      // rede caindo não é falta de permissão: não acuse a pessoa de ter
      // perdido o acesso quando o que faltou foi a resposta do servidor
      if (eu === 'erro') {
        $('viewLogin').style.display = 'block';
        return recado($('erroLogin'),
          'Não consegui falar com o servidor para conferir o seu acesso. '
          + 'Verifique a conexão e tente de novo.');
      }
      quemSou = eu || null;
      // A MESMA REGRA DO trein_is_equipe() NO BANCO.
      // Antes bastava estar ativo. Mas o banco passou a exigir tambem o
      // modulo Treinamentos marcado, e o desencontro era cruel: a
      // recepcionista entrava, a tela abria, e TODO curso aparecia com
      // "0 aulas" em vermelho — o painel dizia que a plataforma inteira
      // estava quebrada, quando o problema era so a permissao dela.
      if (!eu) {
        await sb.auth.signOut();
        $('viewLogin').style.display = 'block';
        return recado($('erroLogin'),
          'Este usuario nao tem acesso a administracao de treinamentos. '
          + 'Peca ao administrador para marcar o modulo Treinamentos em '
          + 'Usuarios, no SistemaCMH.');
      }
      $('quem').textContent = eu.nome || '';
      $('sair').style.display = 'inline-block';
      $('viewLogin').style.display = 'none';
      $('viewAdm').style.display = 'block';
      anotar('trein_admin_entrou');
      carregarCursos();
    }

    // -------------------------------------------------- os cursos no meio
    async function carregarCursos() {
      var r = await sb.from('trein_curso')
        // `titulo_certificado` e `conteudo_programatico` vêm junto porque o
        // painel do curso edita os dois. Fora da lista, a caixa abriria
        // vazia e o primeiro "Salvar certificado" apagaria o conteúdo
        // programático que já estava gravado.
        .select('id,codigo,titulo,subtitulo,descricao,carga_horaria,validade_meses,nota_minima,questoes_por_prova,ativo,titulo_certificado,conteudo_programatico,apostila').order('ordem');

      // A COLUNA `apostila` PODE NÃO EXISTIR AINDA.
      //
      // O site é publicado antes de alguém rodar o SQL, e o PostgREST
      // recusa a consulta INTEIRA quando uma coluna não existe. Sem esta
      // segunda tentativa, o admin abriria com "não consegui ler os
      // cursos" e a pessoa concluiria que a plataforma quebrou — quando o
      // que falta é um arquivo de uma linha.
      if (r.error && /apostila/.test(r.error.message || '')) {
        r = await sb.from('trein_curso')
          .select('id,codigo,titulo,subtitulo,descricao,carga_horaria,validade_meses,nota_minima,questoes_por_prova,ativo,titulo_certificado,conteudo_programatico')
          .order('ordem');
        semApostila = true;
      }
      if (r.error) {
        $('grade').innerHTML = '<p style="color:var(--vermelho)">Não consegui ' +
          'ler os cursos: ' + seguro(r.error.message) + '</p>';
        return;
      }
      cursos = r.data || [];

      var aulas = (await sb.from('trein_aula').select('id,curso_id')).data || [];
      porCurso = {};
      aulas.forEach(function (a) {
        porCurso[a.curso_id] = (porCurso[a.curso_id] || 0) + 1;
      });

      if (!cursos.length) {
        $('grade').innerHTML = '<p style="color:var(--meio)">Nenhum curso no ' +
          'catálogo. Rode o 02-cursos.sql no Supabase.</p>';
        return;
      }

      $('grade').innerHTML = cursos.map(function (c, i) {
        var n = porCurso[c.id] || 0;
        return '<button class="cadm entra' + (c.ativo ? '' : ' inativo') +
          '" data-id="' + c.id + '" style="animation-delay:' +
          (i * 0.04) + 's">' +
          '<span class="cadm__tag">' + seguro(c.codigo) + '</span>' +
          '<h3>' + seguro(c.titulo) + '</h3>' +
          '<p>' + (c.carga_horaria ? c.carga_horaria + ' horas' : '&nbsp;') +
            (c.ativo ? '' : ' · inativo') + '</p>' +
          '<span class="cadm__pe">' +
            '<span class="cadm__n' + (n ? '' : ' zero') + '">' + n + '</span>' +
            '<span class="cadm__un">' + (n === 1 ? 'aula' : 'aulas') + '</span>' +
            '<span class="cadm__ir">' + (n ? 'Ver' : 'Subir vídeo') + ' →</span>' +
          '</span></button>';
      }).join('');

      $('grade').querySelectorAll('.cadm').forEach(function (el) {
        el.addEventListener('click', function () {
          atual = cursos.find(function (c) { return c.id === el.dataset.id; });
          $('painelCursos').style.display = 'none';
          $('painelAulas').style.display = 'block';
          window.scrollTo({ top: 0 });
          verCurso();
        });
      });
    }

    $('voltar').addEventListener('click', function () {
      $('painelAulas').style.display = 'none';
      $('painelCursos').style.display = 'block';
      atual = null;
      carregarCursos();
    });

    // --------------------------------------------------- as aulas do curso
    //
    // `aviso` é mostrado DEPOIS de a tela ser redesenhada. Sem esse
    // parâmetro, escrever o "3 aulas publicadas" antes do verCurso() o
    // apagava, e escrever depois caía num elemento que já não está na
    // página — a mensagem simplesmente não aparecia, e o envio parecia não
    // ter acontecido.
    async function verCurso(aviso, bom) {
      $('corpo').innerHTML = '<p style="color:var(--meio)">Carregando…</p>';
      var quem = await podeAdministrar();
      if (quem === 'erro') {
        // nao desloga por causa de rede: so avisa e deixa a tela como esta
        return recado($('msgAula') || $('corpo'),
          'Nao consegui conferir a sua permissao agora (rede). O que voce '
          + 'acabou de fazer pode ter sido gravado — recarregue a pagina '
          + 'para ver o estado real.');
      }
      if (!quem) return perdeuOAcesso();
      var aulas = (await sb.from('trein_aula')
        .select('id,titulo,descricao,video_url,duracao_seg,ordem')
        .eq('curso_id', atual.id).order('ordem')).data || [];
      await recarregarQuestoes();
      provaAberta = false;

      var html = '<div class="adm__cab"><h1>' + seguro(atual.titulo) + '</h1>' +
        '<p>' + seguro(atual.codigo) + ' · ' + aulas.length + ' aula(s). ' +
        'O aluno assiste na ordem, e só libera a próxima depois de terminar ' +
        'a anterior.</p></div>';

      // ---- dados do curso ------------------------------------------------
      // Título e carga horária estavam só no SQL: para trocar "8 horas" era
      // preciso abrir o painel do Supabase e escrever um update. São
      // números que saem no certificado e no cartão do aluno — têm de ser
      // editáveis por quem responde pelo curso, não por quem sabe SQL.
      html += '<div class="form-aula">' +
        '<h3>Dados do curso</h3>' +
        '<p style="color:var(--meio);font-size:.86rem;margin:-.5rem 0 .2rem">' +
          'O título e a carga horária aparecem no cartão do aluno e saem ' +
          'impressos no certificado.</p>' +
        '<label for="cTitulo">Título</label>' +
        '<input id="cTitulo" type="text" value="' + seguro(atual.titulo) + '" />' +
        '<div class="linha2">' +
          '<div><label for="cHoras">Carga horária (horas)</label>' +
          '<input id="cHoras" type="text" inputmode="numeric" value="' +
            (atual.carga_horaria == null ? '' : atual.carga_horaria) + '" /></div>' +
          '<div><label for="cValidade">Validade (meses)</label>' +
          '<input id="cValidade" type="text" inputmode="numeric" value="' +
            (atual.validade_meses == null ? '' : atual.validade_meses) + '" /></div>' +
        '</div>' +
        '<div class="linha2">' +
          '<div><label for="cNota">Nota mínima (%)</label>' +
          '<input id="cNota" type="text" inputmode="numeric" value="' +
            (atual.nota_minima == null ? 70 : atual.nota_minima) + '" /></div>' +
          '<div><label for="cQtd">Questões por prova</label>' +
          '<input id="cQtd" type="text" inputmode="numeric" value="' +
            (atual.questoes_por_prova == null ? 10 : atual.questoes_por_prova) + '" /></div>' +
        '</div>' +
        '<label for="cSub">Subtítulo <span style="font-weight:400;color:var(--meio)">(aparece na vitrine)</span></label>' +
        '<input id="cSub" type="text" value="' + seguro(atual.subtitulo || '') + '" />' +
        '<label for="cDesc">Descrição</label>' +
        '<textarea id="cDesc">' + seguro(atual.descricao || '') + '</textarea>' +
        '<label style="display:flex;align-items:center;gap:.5rem;margin-top:1rem">' +
          '<input id="cAtivo" type="checkbox" ' + (atual.ativo ? 'checked' : '') +
          ' style="width:auto" /> Curso à venda na vitrine</label>' +
        '<div class="msg" id="msgCurso"></div>' +
        '<button class="i-botao" id="salvarCurso" style="margin-top:1.1rem">' +
        'Salvar dados do curso</button>' +
        '</div>';

      html += aulas.map(function (a, i) {
        var temVideo = !!a.video_url;
        return '<div class="aulaadm">' +
          '<span class="aulaadm__n">' + (i + 1) + '</span>' +
          '<span class="aulaadm__txt"><b>' + seguro(a.titulo) + '</b>' +
          '<span class="' + (temVideo ? '' : 'sem') + '">' +
            (temVideo
              ? 'vídeo publicado' + (a.duracao_seg ? ' · ' + relogio(a.duracao_seg) : '')
              : 'SEM VÍDEO — o aluno não consegue assistir') +
          '</span></span>' +
          '<span class="aulaadm__acoes">' +
            (temVideo ? '<button class="mini" data-ver="' + a.id + '">Ver</button>' : '') +
            (i > 0 ? '<button class="mini" data-sobe="' + a.id + '">↑</button>' : '') +
            (i < aulas.length - 1 ? '<button class="mini" data-desce="' + a.id + '">↓</button>' : '') +
            '<button class="mini perigo" data-apaga="' + a.id + '">Tirar</button>' +
          '</span></div>' +
          '<div id="v' + a.id + '"></div>';
      }).join('') || '<p style="color:var(--meio)">Nenhuma aula ainda. ' +
        'Suba a primeira aqui embaixo.</p>';

      // UMA LINHA POR AULA, cada uma com o SEU titulo.
      //
      // Antes o formulario era um so: com varios arquivos de uma vez, o
      // titulo saia do nome do arquivo. Isso serve para quem nomeia os
      // arquivos com capricho, e nao serve para quem quer escrever
      // "Aula 2 — trabalho a quente" num video chamado "final_v3.mp4".
      //
      // Agora da para acrescentar quantas linhas quiser antes de publicar,
      // e elas entram na ordem em que estao na tela.
      html += '<div class="form-aula">' +
        '<h3>Acrescentar aulas</h3>' +
        '<p style="color:var(--meio);font-size:.86rem;margin:-.5rem 0 .6rem">' +
          'Um modulo tem quantas aulas voce quiser. Preencha uma linha por ' +
          'aula e clique em <b>+ Outra aula</b> para acrescentar mais — elas ' +
          'entram na ordem em que estao aqui. Deixando o titulo em branco, ' +
          'ele sai do nome do arquivo.</p>' +
        '<div id="linhasAula"></div>' +
        '<button class="mini" id="maisAula" style="margin-top:.2rem">' +
        '+ Outra aula</button>' +
        '<div class="prog" id="prog"><i id="progI"></i></div>' +
        '<div class="msg" id="msgAula"></div>' +
        '<button class="i-botao" id="salvar" style="margin-top:1.2rem">' +
        'Publicar</button>' +
        '</div>';

      // ---- a prova ---------------------------------------------------------
      // As questões estavam só no SQL. Trocar uma palavra numa pergunta
      // exigia abrir o painel do Supabase e escrever um update — e quem
      // responde pela prova é o responsável técnico, que não escreve SQL.
      // Prova errada reprova quem sabe e aprova quem não sabe, e é o
      // certificado dele que está em jogo.
      // O RESUMO FICA NUM ELEMENTO PRÓPRIO, e é redesenhado junto com a
      // lista. Antes ele era escrito uma vez, aqui, e o `pintarProva()`
      // só reescrevia a lista embaixo: acrescentar a décima questão
      // deixava o aviso vermelho "todo aluno faz a mesma prova" na tela
      // depois de resolvido — e, pior, apagar questões até ficar abaixo do
      // sorteio NÃO acendia o aviso. O estado mais perigoso ficava
      // invisível até alguém sair do curso e entrar de novo.
      html += '<div class="form-aula">' +
        '<h3>Prova — banco de questões</h3>' +
        '<div id="resumoProva"></div>' +
        '<div class="msg" id="msgProva"></div>' +
        '<button class="i-botao" id="verProva" style="margin-top:1.1rem">' +
        'Ver as questões</button>' +
        '<div id="listaQ"></div>' +
        '</div>';

      // ---- o certificado ---------------------------------------------------
      html += '<div class="form-aula">' +
        '<h3>Certificado</h3>' +
        '<p style="color:var(--meio);font-size:.86rem;margin:-.5rem 0 .2rem">' +
          'O certificado sai com o <b>título</b> abaixo (e não com o título ' +
          'curto do curso), a carga horária dos dados lá em cima, e uma ' +
          'segunda folha com o <b>conteúdo programático</b>. É o que a ' +
          'fiscalização lê para saber o que foi ensinado.</p>' +
        '<label for="cTitCert">Título no certificado ' +
          '<span style="font-weight:400;color:var(--meio)">(vazio = usa o ' +
          'título do curso)</span></label>' +
        '<input id="cTitCert" type="text" value="' +
          seguro(atual.titulo_certificado || '') + '" placeholder="' +
          seguro(atual.titulo) + '" />' +
        '<label for="cConteudo">Conteúdo programático ' +
          '<span style="font-weight:400;color:var(--meio)">(um item por ' +
          'linha; linha vazia é ignorada)</span></label>' +
        '<textarea id="cConteudo" style="min-height:190px">' +
          seguro(atual.conteudo_programatico || '') + '</textarea>' +
        (atual.conteudo_programatico && atual.conteudo_programatico.trim()
          ? ''
          : '<p style="color:var(--vermelho);font-size:.86rem;margin:.6rem 0 0">'
            + 'Sem conteúdo programático o certificado sai <b>com uma folha '
            + 'só</b> — a frente. Melhor uma frente correta do que um verso '
            + 'inventado, mas a segunda folha é o que prova o que foi dado '
            + 'em aula.</p>') +
        '<div class="msg" id="msgCert"></div>' +
        '<div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;' +
          'margin-top:1.1rem">' +
          '<button class="i-botao" id="salvarCert">Salvar certificado</button>' +
          '<button class="mini" id="verCert">Ver o modelo deste curso</button>' +
        '</div>' +
        '<p style="color:var(--meio);font-size:.8rem;margin:.7rem 0 0">' +
          '"Ver o modelo" abre o certificado com <b>este</b> texto e um aluno ' +
          'de exemplo. Não emite nada e não vale como documento — serve para ' +
          'conferir o desenho antes de existir aluno aprovado. Salve antes, ' +
          'senão a amostra mostra o que está gravado, e não o que você acabou ' +
          'de escrever.</p>' +
        '</div>';

      // ---- a apostila ------------------------------------------------------
      //
      // O material de estudo do aluno, editável aqui pelo mesmo motivo da
      // prova e do certificado: quem responde pelo conteúdo é o responsável
      // técnico, e ele não escreve SQL. Uma frase errada numa apostila é
      // corrigida em segundos; num PDF no armazenamento, seria refazer o
      // arquivo e torcer para ninguém ter baixado a versão antiga.
      var apo = String(atual.apostila || '');
      if (semApostila) {
        html += '<div class="form-aula">' +
          '<h3>Apostila — o material de estudo</h3>' +
          '<p style="color:var(--vermelho);font-size:.9rem;margin:-.3rem 0 0">' +
            'A coluna da apostila ainda nao existe no banco. Rode o ' +
            '<b>29-apostila.sql</b> no Supabase e recarregue esta pagina — ' +
            'ai o editor aparece aqui.</p>' +
          '</div>';
      } else {
      var palavras = apo.trim() ? apo.trim().split(/\s+/).length : 0;
      html += '<div class="form-aula">' +
        '<h3>Apostila — o material de estudo</h3>' +
        '<p style="color:var(--meio);font-size:.86rem;margin:-.5rem 0 .2rem">' +
          'É o que o aluno abre no celular no meio do turno e consulta antes ' +
          'da prova. O vídeo ensina, mas ninguém revê 40 minutos de aula ' +
          'para tirar uma dúvida no serviço.</p>' +
        '<p style="color:var(--meio);font-size:.82rem;margin:.5rem 0 0">' +
          'Escreva assim: <b>## título</b> começa um capítulo, ' +
          '<b>### subtítulo</b> divide dentro dele, <b>- item</b> vira lista, ' +
          '<b>**negrito**</b> destaca, e uma linha começando com <b>&gt;</b> ' +
          'vira um aviso amarelo. O resto é parágrafo normal.</p>' +
        '<label for="cApostila">Texto da apostila ' +
          '<span style="font-weight:400;color:var(--meio)">(' +
          (palavras ? palavras + ' palavras hoje' : 'vazia') + ')</span></label>' +
        '<textarea id="cApostila" style="min-height:320px;' +
          'font-family:Consolas,monospace;font-size:.86rem;line-height:1.6">' +
          seguro(apo) + '</textarea>' +
        (palavras
          ? ''
          : '<p style="color:var(--vermelho);font-size:.86rem;margin:.6rem 0 0">'
            + 'Sem apostila, o aluno fica só com o vídeo: no meio do turno, '
            + 'com uma dúvida, ele não tem onde conferir.</p>') +
        '<div class="msg" id="msgApo"></div>' +
        '<div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;' +
          'margin-top:1.1rem">' +
          '<button class="i-botao" id="salvarApo">Salvar apostila</button>' +
          '<button class="mini" id="verApo">Ver como o aluno vê</button>' +
        '</div>' +
        '</div>';
      }

      $('corpo').innerHTML = html;
      if (!semApostila) {
        $('salvarApo').addEventListener('click', salvarApostila);
        $('verApo').addEventListener('click', function () {
          window.open('apostila.html?amostra=1&curso=' + atual.id, '_blank');
        });
      }
      $('salvar').addEventListener('click', function () { salvarAula(aulas); });
      $('corpo').querySelectorAll('[data-apaga]').forEach(function (b) {
        b.addEventListener('click', function () { apagar(b.dataset.apaga); });
      });
      $('corpo').querySelectorAll('[data-sobe]').forEach(function (b) {
        b.addEventListener('click', function () { mover(b.dataset.sobe, -1, aulas); });
      });
      $('corpo').querySelectorAll('[data-desce]').forEach(function (b) {
        b.addEventListener('click', function () { mover(b.dataset.desce, 1, aulas); });
      });
      $('corpo').querySelectorAll('[data-ver]').forEach(function (b) {
        b.addEventListener('click', function () {
          espiar(aulas.find(function (a) { return a.id === b.dataset.ver; }));
        });
      });
      pintarResumoProva();
      linhasAula = 0;
      questoesBaseAula = aulas.length;
      novaLinhaAula(aulas.length + 1);
      $('maisAula').addEventListener('click', function () {
        novaLinhaAula(aulas.length + linhasAula + 1);
      });
      $('salvarCurso').addEventListener('click', salvarCurso);
      $('salvarCert').addEventListener('click', salvarCertificado);
      $('verCert').addEventListener('click', function () {
        window.open('certificado.html?amostra=1&curso=' +
                    encodeURIComponent(atual.id), '_blank');
      });
      $('verProva').addEventListener('click', function () {
        provaAberta = !provaAberta;
        pintarProva();
      });
      pintarProva();
      // a mensagem vai para a caixa que existir: "Dados do curso salvos"
      // pertence ao formulario do topo, nao ao de upload la embaixo
      if (aviso) recado($(alvoDoAviso || 'msgAula'), aviso, bom);
      alvoDoAviso = null;
    }

    // Cada linha e uma aula: titulo proprio, descricao e o arquivo. O
    // numero mostrado e o que ela VAI ter no curso, para a pessoa ver a
    // sequencia enquanto preenche.
    function novaLinhaAula(numero) {
      var caixa = $('linhasAula');
      if (!caixa) return;
      linhasAula += 1;
      var id = 'la' + linhasAula;
      var bloco = document.createElement('div');
      bloco.className = 'linha-aula';
      bloco.id = id;
      bloco.innerHTML =
        '<div class="linha-aula__cab">' +
          '<b>Aula ' + numero + '</b>' +
          (linhasAula > 1
            ? '<button class="mini perigo" data-tira="' + id + '">Tirar</button>'
            : '') +
        '</div>' +
        '<label>Titulo <span style="font-weight:400;color:var(--meio)">' +
          '(em branco, sai do nome do arquivo)</span></label>' +
        '<input type="text" data-papel="titulo" placeholder="ex.: Aula ' +
          numero + ' — o que a norma exige" />' +
        '<label>Descricao <span style="font-weight:400;color:var(--meio)">' +
          '(opcional)</span></label>' +
        '<textarea data-papel="desc" placeholder="aparece embaixo do video"></textarea>' +
        '<label>Video</label>' +
        '<input type="file" accept="video/*" multiple data-papel="arq" />';
      caixa.appendChild(bloco);
      var tirar = bloco.querySelector('[data-tira]');
      if (tirar) {
        tirar.addEventListener('click', function () {
          bloco.remove();
          renumerarLinhas();
        });
      }
    }

    // Depois de tirar uma linha do meio, as de baixo mudam de numero.
    // Sem isto a tela mostraria "Aula 2, Aula 4" e a pessoa acharia que
    // perdeu uma.
    function renumerarLinhas() {
      var base = questoesBaseAula;
      $('linhasAula').querySelectorAll('.linha-aula').forEach(function (b, i) {
        var t = b.querySelector('.linha-aula__cab b');
        if (t) t.textContent = 'Aula ' + (base + i + 1);
      });
    }

    // Grava os dados do curso. Numero vazio vira null de proposito: "sem
    // carga horaria definida" e diferente de "zero horas", e o certificado
    // precisa saber a diferenca para nao imprimir "0 horas".
    async function salvarCurso() {
      var msg = $('msgCurso'), b = $('salvarCurso');
      function numero(id, minimo, maximo) {
        var t = $(id).value.trim();
        if (!t) return null;
        var n = parseInt(t.replace(/\D/g, ''), 10);
        if (isNaN(n) || n < minimo || n > maximo) return undefined;  // invalido
        return n;
      }
      var titulo = $('cTitulo').value.trim();
      if (!titulo) return recado(msg, 'O curso precisa de um titulo.');

      var horas = numero('cHoras', 1, 999);
      var validade = numero('cValidade', 1, 600);
      var nota = numero('cNota', 1, 100);
      var qtd = numero('cQtd', 1, 200);
      if (horas === undefined)    return recado(msg, 'Carga horaria: use um numero de 1 a 999.');
      if (validade === undefined) return recado(msg, 'Validade: use um numero de meses, ou deixe vazio.');
      if (nota === undefined || nota === null)
        return recado(msg, 'Nota minima: use um numero de 1 a 100.');
      if (qtd === undefined || qtd === null)
        return recado(msg, 'Questoes por prova: use um numero de 1 a 200.');

      // TIRAR O CURSO DO AR NAO E SO A VITRINE.
      // A politica do banco devolve curso so quando `ativo`; desmarcado,
      // ele some tambem para QUEM JA ESTA MATRICULADO — curso pago, no
      // prazo, inacessivel. Por isso a conta de quantos seriam atingidos
      // aparece ANTES, e nao como surpresa depois.
      if (atual.ativo && !$('cAtivo').checked) {
        var q = await sb.from('trein_matricula')
          .select('id', { count: 'exact', head: true })
          .eq('curso_id', atual.id).eq('cancelada', false)
          .gte('expira_em', new Date().toISOString().slice(0, 10));
        var quantos = q.count || 0;
        if (quantos && !confirm(
              'Tirar este curso do ar vai bloquear ' + quantos +
              ' aluno(s) que estao matriculados e dentro do prazo: eles '
              + 'deixam de conseguir assistir as aulas.\n\nTem certeza?')) {
          return;
        }
      }
      b.disabled = true; b.textContent = 'Salvando...';
      var r = await sb.from('trein_curso').update({
        titulo: titulo,
        subtitulo: $('cSub').value.trim() || null,
        descricao: $('cDesc').value.trim() || null,
        carga_horaria: horas,
        validade_meses: validade,
        nota_minima: nota,
        questoes_por_prova: qtd,
        ativo: $('cAtivo').checked
      }).eq('id', atual.id).select().maybeSingle();
      b.disabled = false; b.textContent = 'Salvar dados do curso';

      if (r.error) return recado(msg, 'Nao consegui salvar: ' + seguro(r.error.message));
      if (!r.data) {
        return recado(msg, 'O servidor aceitou o pedido mas nao gravou nada. '
          + 'Isso costuma ser permissao: confira se o seu usuario tem o '
          + 'modulo Treinamentos marcado no SistemaCMH.');
      }
      // o objeto em memoria tem de acompanhar, senao a tela redesenha com
      // os valores velhos e parece que nao salvou
      atual = r.data;
      var i = cursos.findIndex(function (c) { return c.id === atual.id; });
      if (i >= 0) cursos[i] = atual;
      carregarCursos();
      anotar('trein_curso_alterado',
        atual.codigo + ': ' + titulo +
        ' · ' + (horas == null ? 'sem carga' : horas + 'h') +
        ' · nota ' + nota + '%' +
        ' · ' + qtd + ' questoes' +
        ' · ' + ($('cAtivo').checked ? 'a venda' : 'FORA DA VITRINE'));
      alvoDoAviso = 'msgCurso';
      verCurso('Dados do curso salvos.', true);
    }

    // Grava só o que sai impresso no certificado. Botão separado do "Salvar
    // dados do curso" de propósito: mexer no conteúdo programático é mexer
    // no documento que a fiscalização lê, e não na vitrine.
    async function salvarApostila() {
      var msg = $('msgApo'), b = $('salvarApo');
      var texto = String($('cApostila').value || '');

      // apagar o material inteiro pede confirmacao, como o conteudo
      // programatico: o aluno perde a unica coisa que ele consulta fora do
      // video, e nao ha desfazer
      var tinha = String((atual && atual.apostila) || '').trim();
      if (tinha && !texto.trim() && !confirm(
            'Isto vai APAGAR a apostila deste curso.\n\nO aluno fica so com '
            + 'o video: no meio do turno, com uma duvida, sem onde conferir.'
            + '\n\nTem certeza?')) {
        return;
      }

      b.disabled = true; b.textContent = 'Salvando...';
      var r = await sb.from('trein_curso')
        .update({ apostila: texto.trim() || null })
        .eq('id', atual.id).select().maybeSingle();
      b.disabled = false; b.textContent = 'Salvar apostila';

      if (r.error) return recado(msg, 'Nao consegui salvar: ' + seguro(r.error.message));
      if (!r.data) {
        return recado(msg, 'O servidor aceitou o pedido mas nao gravou nada. '
          + 'Isso costuma ser permissao: confira se o seu usuario tem o '
          + 'modulo Treinamentos marcado no SistemaCMH.');
      }
      atual = r.data;
      var i = cursos.findIndex(function (c) { return c.id === atual.id; });
      if (i >= 0) cursos[i] = atual;
      var quantas = texto.trim() ? texto.trim().split(/\s+/).length : 0;
      anotar('trein_apostila_alterada',
        atual.codigo + ': ' + quantas + ' palavras');
      alvoDoAviso = 'msgApo';
      verCurso(quantas
        ? 'Apostila salva — ' + quantas + ' palavras.'
        : 'Apostila apagada.', true);
    }

    async function salvarCertificado() {
      // APAGAR O CONTEUDO INTEIRO PEDE CONFIRMACAO.
      // Ir de doze itens para zero e um Ctrl+A e um Delete, e a resposta
      // saia em VERDE — "sai com uma folha so" — como se fosse escolha.
      // O verso e o que prova o que foi ensinado, e todo certificado
      // emitido dali em diante sai sem ele. O resto deste arquivo confirma
      // antes de apagar aula, questao e curso; isto ficou de fora.
      var tinha = String((atual && atual.conteudo_programatico) || '').trim();
      var vai = String($('cConteudo').value || '').trim();
      if (tinha && !vai && !confirm(
            'Isto vai APAGAR o conteudo programatico deste curso.\n\n'
            + 'Todo certificado emitido a partir de agora sai com uma folha '
            + 'so, sem o verso que mostra o que foi ensinado.\n\nTem certeza?')) {
        return;
      }
      var msg = $('msgCert'), b = $('salvarCert');
      var conteudo = $('cConteudo').value.replace(/\r/g, '').trim();
      b.disabled = true; b.textContent = 'Salvando...';
      var r = await sb.from('trein_curso').update({
        titulo_certificado: $('cTitCert').value.trim() || null,
        conteudo_programatico: conteudo || null
      }).eq('id', atual.id).select().maybeSingle();
      b.disabled = false; b.textContent = 'Salvar certificado';

      if (r.error) return recado(msg, 'Nao consegui salvar: ' + seguro(r.error.message));
      if (!r.data) {
        return recado(msg, 'O servidor aceitou o pedido mas nao gravou nada. '
          + 'Isso costuma ser permissao: confira se o seu usuario tem o '
          + 'modulo Treinamentos marcado no SistemaCMH.');
      }
      atual = r.data;
      var i = cursos.findIndex(function (c) { return c.id === atual.id; });
      if (i >= 0) cursos[i] = atual;
      var itens = conteudo ? conteudo.split('\n').filter(function (l) {
        return l.trim();
      }).length : 0;
      anotar('trein_certificado_alterado',
        atual.codigo + ': ' + itens + ' item(ns) de conteudo programatico');
      alvoDoAviso = 'msgCert';
      verCurso('Certificado salvo. ' + (itens
        ? itens + ' item(ns) no conteúdo programático.'
        : 'Sem conteúdo programático: sai com uma folha só.'), true);
    }

    // ------------------------------------------------------- a prova
    //
    // O `correta` é o ÍNDICE da alternativa certa dentro do array, contando
    // do zero. Guardar a letra não serviria: a Edge Function embaralha as
    // alternativas a cada prova, justamente para "é a letra C" não virar
    // resposta transmissível entre colegas.
    // O resumo do banco de questoes. Desenhado sempre que a lista muda,
    // e nao uma vez so: e ele que diz se todo aluno esta fazendo a mesma
    // prova, e essa frase nao pode ficar velha na tela.
    function pintarResumoProva() {
      var caixa = $('resumoProva');
      if (!caixa) return;
      var sorteia = Number(atual.questoes_por_prova) || 10;
      var quantas = questoes.length;
      var faltando = quantas < sorteia;
      caixa.innerHTML =
        '<p style="color:var(--meio);font-size:.86rem;margin:-.5rem 0 .2rem">' +
          'A prova <b>sorteia ' + sorteia + '</b> questoes das <b>' + quantas +
          '</b> que estao aqui, e embaralha as alternativas a cada tentativa ' +
          '— por isso ninguem dita "e a letra C" para o colega. Quanto maior ' +
          'o banco, menos duas provas saem iguais.</p>' +
        (faltando
          ? '<p style="color:var(--vermelho);font-size:.86rem;margin:.6rem 0 0">'
            + 'Sao menos questoes do que a prova sorteia: com ' + quantas +
            ' no banco, <b>todo aluno faz a mesma prova</b>. Acrescente '
            + 'questoes, ou baixe "Questoes por prova" la em cima.</p>'
          : '');
    }

    // Devolve '' quando deu certo, e a mensagem quando falhou.
    //
    // EM CASO DE ERRO A LISTA EM MEMÓRIA NÃO É TOCADA. Antes fazia
    // `questoes = r.data || []`, e uma queda de rede zerava o array: a tela
    // anunciava, em verde, "Questão removida. Sobram 0 no banco" e mostrava
    // "Nenhuma questão ainda" para um curso com 150. Pânico falso — e o
    // próximo "Acrescentar" nasceria com ordem 1, colidindo com a que
    // existe.
    async function recarregarQuestoes() {
      var r = await sb.from('trein_questao')
        .select('id,enunciado,alternativas,correta,ordem')
        .eq('curso_id', atual.id).order('ordem');
      if (r.error) return r.error.message;
      questoes = r.data || [];
      return '';
    }

    // O jsonb chega pronto como array, mas um banco antigo pode ter
    // guardado o array como TEXTO. Sem isto, a tela mostraria a questão sem
    // nenhuma alternativa e daria a impressão de que ela se perdeu.
    function alternativasDe(q) {
      var a = q && q.alternativas;
      if (typeof a === 'string') {
        try { a = JSON.parse(a); } catch (e) { a = []; }
      }
      if (!Array.isArray(a)) return [];
      return a.map(function (t) { return String(t == null ? '' : t); });
    }

    var LETRAS = 'ABCDEFGH';

    function pintarProva() {
      pintarResumoProva();
      var botao = $('verProva'), lista = $('listaQ');
      if (!botao || !lista) return;
      botao.textContent = provaAberta ? 'Fechar as questões'
        : (questoes.length ? 'Ver as ' + questoes.length + ' questões'
                           : 'Escrever a primeira questão');
      if (!provaAberta) { lista.innerHTML = ''; return; }

      lista.innerHTML = '<div style="margin-top:1.2rem">' +
        questoes.map(function (q, i) {
          var lista_alts = alternativasDe(q);
          var alts = lista_alts.map(function (t, j) {
            return '<li class="' + (j === q.correta ? 'certa' : '') + '">' +
              '<b>' + (LETRAS[j] || (j + 1)) + ')</b> ' + seguro(t) +
              (j === q.correta ? ' &nbsp;✓ certa' : '') + '</li>';
          }).join('');

          // O PAINEL TEM DE GRITAR O QUE ATINGE O ALUNO.
          //
          // Uma questão cujo `correta` aponte para fora das alternativas
          // era desenhada SEM linha verde e sem aviso nenhum — e na prova
          // ela é erro automático para todo mundo. Numa lista de 150,
          // ninguém repara na falta de um "✓ certa".
          //
          // O mesmo vale para alternativas gravadas como TEXTO em vez de
          // array: o `alternativasDe()` conserta para a tela, e aí o
          // painel mostra a questão perfeita enquanto a Edge Function
          // entrega ao aluno uma questão SEM alternativa nenhuma — porque
          // lá o fallback não existe. O conserto defensivo escondia
          // justamente o defeito.
          var doente = '';
          if (!(q.correta >= 0 && q.correta < lista_alts.length)) {
            doente = 'gabarito aponta para uma alternativa que não existe: '
                   + 'esta questão é erro automático para todo aluno';
          } else if (typeof q.alternativas === 'string') {
            doente = 'as alternativas estão gravadas como texto, e não como '
                   + 'lista: o aluno recebe esta questão SEM alternativas';
          } else if (lista_alts.length < 2) {
            doente = 'menos de duas alternativas';
          }

          return '<div class="qadm' + (doente ? ' qadm--ruim' : '') + '">' +
            (doente ? '<div class="qadm__alerta">⚠ ' + doente +
                      '. Abra em Editar e grave de novo para consertar.</div>' : '') +
            '<div class="qadm__cab">' +
            '<span class="aulaadm__n">' + (i + 1) + '</span>' +
            '<span class="qadm__en">' + seguro(q.enunciado) + '</span>' +
            '<span class="aulaadm__acoes">' +
              '<button class="mini" data-qedita="' + q.id + '">Editar</button>' +
              (i > 0 ? '<button class="mini" data-qsobe="' + q.id + '">↑</button>' : '') +
              (i < questoes.length - 1
                ? '<button class="mini" data-qdesce="' + q.id + '">↓</button>' : '') +
              '<button class="mini perigo" data-qapaga="' + q.id + '">Tirar</button>' +
            '</span></div>' +
            '<ol>' + alts + '</ol>' +
            '<div id="q' + q.id + '"></div></div>';
        }).join('') +
        (questoes.length ? '' : '<p style="color:var(--meio)">Nenhuma questão ' +
          'ainda. Sem questões o aluno não consegue fazer a prova, e sem ' +
          'prova não existe certificado.</p>') +
        '<div id="novaQ"></div>' +
        '<button class="mini" id="btnNovaQ" style="margin-top:.4rem">' +
        '+ Acrescentar questão</button></div>';

      lista.querySelectorAll('[data-qedita]').forEach(function (b) {
        b.addEventListener('click', function () { editarQuestao(b.dataset.qedita); });
      });
      lista.querySelectorAll('[data-qapaga]').forEach(function (b) {
        b.addEventListener('click', function () { apagarQuestao(b.dataset.qapaga); });
      });
      lista.querySelectorAll('[data-qsobe]').forEach(function (b) {
        b.addEventListener('click', function () { moverQuestao(b.dataset.qsobe, -1); });
      });
      lista.querySelectorAll('[data-qdesce]').forEach(function (b) {
        b.addEventListener('click', function () { moverQuestao(b.dataset.qdesce, 1); });
      });
      $('btnNovaQ').addEventListener('click', function () { editarQuestao(null); });
    }

    // Um editor por vez. Dois abertos disputariam os mesmos ids (`qEnun`,
    // `msgQ`) e o botão Gravar do segundo escreveria o texto do primeiro.
    function fecharEditores() {
      var lista = $('listaQ');
      if (!lista) return;
      lista.querySelectorAll('.editorQ').forEach(function (e) { e.remove(); });
    }

    function editarQuestao(id) {
      var q = id ? questoes.find(function (x) { return x.id === id; }) : null;
      if (id && !q) return;
      var caixa = id ? $('q' + id) : $('novaQ');
      if (!caixa) return;
      var jaAberto = !!caixa.querySelector('.editorQ');
      fecharEditores();
      if (jaAberto) return;               // clicar de novo fecha

      var alts = q ? alternativasDe(q) : [];
      while (alts.length < 5) alts.push('');
      var linhas = alts.map(function (t, j) {
        return '<div style="display:flex;align-items:center;gap:.6rem;' +
            'margin:.4rem 0">' +
          '<input type="radio" name="qcerta" value="' + j + '"' +
            (q && q.correta === j ? ' checked' : '') +
            ' style="width:auto;flex:none;accent-color:#35c47a" />' +
          '<span style="flex:none;width:1.2rem;color:var(--meio);' +
            'font-weight:700;font-size:.85rem">' + LETRAS[j] + ')</span>' +
          '<input type="text" class="qalt" style="flex:1" value="' +
            seguro(t) + '" placeholder="alternativa ' + LETRAS[j] +
            (j > 1 ? ' — pode ficar vazia' : '') + '" />' +
        '</div>';
      }).join('');

      caixa.innerHTML = '<div class="editorQ" style="border-top:1px solid ' +
          'var(--linha-i);margin-top:.9rem;padding-top:.4rem">' +
        '<label for="qEnun">Enunciado</label>' +
        '<textarea id="qEnun">' + seguro(q ? q.enunciado : '') + '</textarea>' +
        '<label style="margin-bottom:.1rem">Alternativas ' +
          '<span style="font-weight:400;color:var(--meio)">(marque a certa ' +
          'na bolinha; as vazias são ignoradas)</span></label>' +
        linhas +
        '<div class="msg" id="msgQ"></div>' +
        '<div style="display:flex;gap:.6rem;align-items:center;' +
          'margin-top:.9rem">' +
          '<button class="i-botao" id="gravarQ">' +
            (q ? 'Gravar alteração' : 'Acrescentar') + '</button>' +
          '<button class="mini" id="cancelarQ">Cancelar</button>' +
        '</div></div>';
      $('gravarQ').addEventListener('click', function () { gravarQuestao(id); });
      $('cancelarQ').addEventListener('click', fecharEditores);
      $('qEnun').focus();
    }

    async function gravarQuestao(id) {
      var msg = $('msgQ'), b = $('gravarQ');
      var enun = $('qEnun').value.replace(/\s+/g, ' ').trim();
      var campos = Array.prototype.slice.call(
        document.querySelectorAll('.editorQ .qalt'));
      var marcada = document.querySelector('.editorQ input[name=qcerta]:checked');
      if (!enun) return recado(msg, 'Escreva o enunciado.');
      if (!marcada) return recado(msg, 'Marque qual alternativa é a certa.');

      // As vazias somem, e o índice da certa acompanha o que SOBROU.
      // Gravar a posição do campo em tela deixaria o gabarito apontando
      // para uma alternativa que não existe — a prova reprovaria quem
      // acertou, e ninguém desconfiaria do motivo.
      var certaEm = Number(marcada.value), correta = -1, alts = [];
      campos.forEach(function (c, j) {
        var t = c.value.replace(/\s+/g, ' ').trim();
        if (!t) return;
        if (j === certaEm) correta = alts.length;
        alts.push(t);
      });
      if (alts.length < 2) {
        return recado(msg, 'A questão precisa de pelo menos duas alternativas.');
      }
      if (correta < 0) {
        return recado(msg, 'A alternativa marcada como certa está vazia. '
          + 'Escreva o texto dela, ou marque outra.');
      }
      var repetida = alts.some(function (t, i) {
        return alts.indexOf(t) !== i;
      });
      if (repetida) {
        return recado(msg, 'Duas alternativas estão com o mesmo texto — '
          + 'uma delas seria certa e errada ao mesmo tempo.');
      }

      b.disabled = true; b.textContent = 'Gravando...';
      var dados = { enunciado: enun, alternativas: alts, correta: correta };
      var r;
      if (id) {
        r = await sb.from('trein_questao').update(dados).eq('id', id).select('id');
      } else {
        // o MAIOR `ordem` existente, e não a contagem: com uma questão
        // tirada no meio, a contagem repetiria um número que já existe
        dados.curso_id = atual.id;
        dados.ordem = questoes.reduce(function (m, q) {
          return Math.max(m, Number(q.ordem) || 0);
        }, 0) + 1;
        r = await sb.from('trein_questao').insert(dados).select('id');
      }
      b.disabled = false; b.textContent = id ? 'Gravar alteração' : 'Acrescentar';

      if (r.error) return recado(msg, 'Nao consegui gravar: ' + seguro(r.error.message));
      if (!r.data || !r.data.length) {
        return recado(msg, 'O servidor aceitou o pedido mas nao gravou nada. '
          + 'Isso costuma ser permissao: confira se o seu usuario tem o '
          + 'modulo Treinamentos marcado no SistemaCMH.');
      }
      anotar('trein_questao_' + (id ? 'alterada' : 'nova'),
             atual.codigo + ': ' + enun.slice(0, 140));
      var erro = await recarregarQuestoes();
      pintarProva();
      recado($('msgProva'), erro
        ? 'Gravei, mas nao consegui reler a lista: ' + seguro(erro)
        : (id ? 'Questão alterada.' : 'Questão acrescentada. Agora são ' +
           questoes.length + ' no banco.'), !erro);
    }

    async function apagarQuestao(id) {
      var q = questoes.find(function (x) { return x.id === id; });
      if (!q) return;
      var sorteia = Number(atual.questoes_por_prova) || 10;
      var sobram = questoes.length - 1;
      var aviso = sobram < sorteia
        ? '\n\nATENÇÃO: sobram ' + sobram + ' questões e a prova sorteia ' +
          sorteia + '. Com menos questões do que o sorteio, todo aluno passa ' +
          'a fazer a mesma prova.'
        : '';
      if (!confirm('Tirar esta questão?\n\n' + q.enunciado + aviso +
                   '\n\nNão tem volta.')) return;
      // `.select()` para saber se APAGOU MESMO: delete barrado pela RLS não
      // devolve erro, volta 204 com zero linhas
      var r = await sb.from('trein_questao').delete().eq('id', id).select('id');
      if (r.error) {
        return recado($('msgProva'), 'Nao consegui remover: ' + seguro(r.error.message));
      }
      if (!r.data || !r.data.length) {
        return recado($('msgProva'), 'Nada foi removido. Isso costuma ser '
          + 'permissao: confira se o seu usuario tem o modulo Treinamentos '
          + 'marcado no SistemaCMH.');
      }
      anotar('trein_questao_removida', atual.codigo + ': ' + q.enunciado.slice(0, 140));
      var falhou = await recarregarQuestoes();
      pintarProva();
      if (falhou) {
        return recado($('msgProva'), 'A questao foi removida, mas nao ' +
          'consegui reler a lista: ' + seguro(falhou) +
          ' — recarregue a pagina para ver o estado real.');
      }
      recado($('msgProva'), 'Questão removida. Sobram ' + questoes.length +
             ' no banco.', true);
    }

    async function moverQuestao(id, passo) {
      var i = questoes.findIndex(function (q) { return q.id === id; });
      var j = i + passo;
      if (i < 0 || j < 0 || j >= questoes.length) return;
      // troca a ordem das duas. Falhando a segunda gravação, a primeira é
      // desfeita: duas questões com o mesmo número deixam a lista da tela
      // trocar de posição sozinha entre uma visita e outra
      var a = questoes[i], b = questoes[j];
      // Duas questões com o MESMO número não têm o que trocar: o botão
      // pareceria quebrado. Acontece com banco importado de SQL antigo,
      // onde tudo entrou com ordem 0. Numera 1..N antes e segue.
      if (Number(a.ordem) === Number(b.ordem)) {
        for (var k = 0; k < questoes.length; k++) {
          if (Number(questoes[k].ordem) === k + 1) continue;
          var u = await sb.from('trein_questao')
            .update({ ordem: k + 1 }).eq('id', questoes[k].id).select('id');
          if (u.error || !u.data || !u.data.length) {
            return recado($('msgProva'), 'Nao consegui numerar as questões. '
              + 'Recarregue e tente de novo.');
          }
          questoes[k].ordem = k + 1;
        }
        a = questoes[i]; b = questoes[j];
      }
      var p = await sb.from('trein_questao')
        .update({ ordem: b.ordem }).eq('id', a.id).select('id');
      if (p.error || !p.data || !p.data.length) {
        return recado($('msgProva'), 'Nao consegui reordenar. Recarregue e '
          + 'tente de novo.');
      }
      var s = await sb.from('trein_questao')
        .update({ ordem: a.ordem }).eq('id', b.id).select('id');
      if (s.error || !s.data || !s.data.length) {
        await sb.from('trein_questao').update({ ordem: a.ordem }).eq('id', a.id);
        return recado($('msgProva'), 'Nao consegui reordenar. Recarregue e '
          + 'tente de novo.');
      }
      var erroMover = await recarregarQuestoes();
      pintarProva();
      if (erroMover) {
        recado($('msgProva'), 'Reordenei, mas nao consegui reler a lista: ' +
          seguro(erroMover) + ' — recarregue a pagina.');
      }
    }

    // Mostra o vídeo da aula ali mesmo. Com dez arquivos parecidos no mesmo
    // módulo, clicar em "Tirar" no escuro apaga o errado — e o vídeo vai
    // junto, sem volta. Clicar de novo fecha.
    async function espiar(aula) {
      var caixa = $('v' + aula.id);
      if (!caixa) return;
      if (caixa.innerHTML) { caixa.innerHTML = ''; return; }
      caixa.innerHTML = '<p style="color:var(--meio);font-size:.85rem">Abrindo…</p>';
      var ass = await sb.storage.from('treinamentos')
        .createSignedUrl(String(aula.video_url).replace(/^\/+/, ''), 60 * 30);
      if (!ass.data || !ass.data.signedUrl) {
        caixa.innerHTML = '<p style="color:var(--vermelho);font-size:.85rem">' +
          'Não consegui abrir este arquivo — ele pode ter sido removido do ' +
          'armazenamento.</p>';
        return;
      }
      caixa.innerHTML = '<video controls style="width:100%;max-width:520px;' +
        'border-radius:12px;margin:-.2rem 0 .9rem;background:#000" src="' +
        ass.data.signedUrl + '"></video>';
    }

    // Título a partir do nome do arquivo, quando vêm vários de uma vez.
    // "02 - Trabalho a quente.mp4" vira "Trabalho a quente": some a
    // extensão, some o número da frente (a ordem já é dada pela posição na
    // fila) e os separadores viram espaço.
    function tituloDoArquivo(nome) {
      var s = String(nome || '').replace(/\.[^.]+$/, '');
      s = s.replace(/^[\s\-_.]*\d{1,3}[\s\-_.]+/, '');
      s = s.replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
      return s || nome;
    }

    // ---------------------------------------------------- publicar aula(s)
    //
    // Aceita VÁRIOS arquivos de uma vez. Um módulo de NR pode ter dez aulas,
    // e subir uma por uma, voltando à tela a cada vez, é dez vezes o mesmo
    // trabalho. Os arquivos entram na ordem do nome, cada um vira uma aula.
    //
    // Um de cada vez, e não todos em paralelo: são arquivos grandes, e
    // disparar dez uploads juntos costuma derrubar a conexão e deixar
    // metade pela metade. Em fila, o que falhou é só o último.
    async function salvarAula(aulas) {
      var msg = $('msgAula'), botao = $('salvar');

      // Monta a fila a partir das LINHAS da tela, na ordem em que estao.
      // Cada linha leva o titulo que a pessoa escreveu; em branco, ou com
      // varios arquivos na mesma linha, o titulo sai do nome do arquivo.
      var fila = [];
      var blocos = $('linhasAula').querySelectorAll('.linha-aula');
      for (var b = 0; b < blocos.length; b++) {
        var linha = blocos[b];
        var tit = linha.querySelector('[data-papel="titulo"]').value.trim();
        var desc = linha.querySelector('[data-papel="desc"]').value.trim();
        var esc = Array.from(linha.querySelector('[data-papel="arq"]').files);
        if (!esc.length) continue;
        esc.sort(function (x, y) {
          return x.name.localeCompare(y.name, 'pt-BR', { numeric: true });
        });
        (function (tit, desc, esc) {
          esc.forEach(function (arq, k) {
            fila.push({
              arquivo: arq,
              titulo: (esc.length === 1 && tit) ? tit : tituloDoArquivo(arq.name),
              descricao: (esc.length === 1 ? desc : (k === 0 ? desc : '')) || null
            });
          });
        })(tit, desc, esc);
      }

      if (!fila.length) return recado(msg, 'Escolha o arquivo de video.');
      var grandes = fila.filter(function (x) { return x.arquivo.size > LIMITE; });
      if (grandes.length) {
        return recado(msg, 'Estes passam do limite de 2 GB: ' +
          grandes.map(function (x) { return seguro(x.arquivo.name); }).join(', ') +
          '. Comprima antes de subir.');
      }
      var arquivos = fila;

      botao.disabled = true;
      $('prog').style.display = 'block';
      recado(msg, '');

      // O MAIOR `ordem` EXISTENTE, e nao a contagem.
      // Com 3 aulas (1,2,3), tirar a primeira deixa 2 e 3 — e a contagem
      // vira 2, entao a proxima publicacao nasceria com ordem 3, empatada
      // com a que ja existe. Ordem repetida faz a sequencia do aluno
      // trocar de posicao entre uma visita e outra, e a aula liberada
      // travar sozinha.
      var ordem = aulas.reduce(function (m, a) {
        return Math.max(m, Number(a.ordem) || 0);
      }, 0);
      var prontas = 0;

      for (var i = 0; i < arquivos.length; i++) {
        var item = arquivos[i];
        var arquivo = item.arquivo;
        botao.textContent = arquivos.length > 1
          ? 'Enviando ' + (i + 1) + ' de ' + arquivos.length + '…'
          : 'Enviando…';
        $('progI').style.width = ((i / arquivos.length) * 100 + 4) + '%';

        // o caminho começa pelo id do curso: é assim que a regra do Storage
        // sabe se aquele aluno pode baixar (ela lê a primeira pasta)
        // nome sem ponto devolveria o nome inteiro como "extensao"
        var pedacos = arquivo.name.split('.');
        var ext = (pedacos.length > 1 ? pedacos.pop() : 'mp4')
          .toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'mp4';
        var caminho = atual.id + '/' + Date.now() + '-' + i + '.' + ext;

        // a duração sai do próprio arquivo: pedir para digitar é pedir para
        // errar, e o número aparece para o aluno
        var duracao = await new Promise(function (ok) {
          var v = document.createElement('video');
          v.preload = 'metadata';
          v.onloadedmetadata = function () {
            URL.revokeObjectURL(v.src); ok(Math.round(v.duration) || null);
          };
          v.onerror = function () { URL.revokeObjectURL(v.src); ok(null); };
          // alguns conteineres nao disparam nem `loadedmetadata` nem
          // `error` em certos navegadores: sem este prazo, a fila ficava
          // presa e o botao "Publicar" desabilitado ate recarregar
          setTimeout(function () { ok(null); }, 15000);
          v.src = URL.createObjectURL(arquivo);
        });

        var envio = await sb.storage.from('treinamentos')
          .upload(caminho, arquivo, { upsert: false, contentType: arquivo.type });
        if (envio.error) {
          botao.disabled = false; botao.textContent = 'Publicar';
          $('prog').style.display = 'none';
          // o aviso vai DENTRO do verCurso: escrito antes, o redesenho o
          // apaga; escrito depois, cai num elemento que já saiu da página
          return verCurso((prontas ? prontas + ' aula(s) entraram. ' : '') +
            'Parei em "' + seguro(arquivo.name) + '": ' + seguro(envio.error.message));
        }

        ordem += 1;
        var r = await sb.from('trein_aula').insert({
          curso_id: atual.id,
          titulo: item.titulo,
          descricao: item.descricao,
          video_url: caminho, duracao_seg: duracao,
          ordem: ordem
        });
        if (r.error) {
          // o vídeo subiu mas a aula não gravou: apaga o arquivo, senão fica
          // ocupando espaço sem nada apontando para ele
          await sb.storage.from('treinamentos').remove([caminho]);
          botao.disabled = false; botao.textContent = 'Publicar';
          $('prog').style.display = 'none';
          return verCurso((prontas ? prontas + ' aula(s) entraram. ' : '') +
            'Não consegui salvar "' + seguro(arquivo.name) + '": ' + seguro(r.error.message));
        }
        anotar('trein_aula_publicada',
          atual.codigo + ': ' + item.titulo +
          ' (' + (duracao ? Math.round(duracao / 60) + ' min' : 'sem duracao') +
          ', ' + Math.round(arquivo.size / 1048576) + ' MB)');
        prontas += 1;
      }

      botao.disabled = false; botao.textContent = 'Publicar';
      $('progI').style.width = '100%';
      $('prog').style.display = 'none';
      verCurso(prontas === 1
        ? 'Aula publicada. Pode subir a próxima aqui embaixo.'
        : prontas + ' aulas publicadas, na ordem do nome do arquivo.', true);
    }

    async function apagar(id) {
      if (!confirm('Tirar esta aula? O vídeo também é apagado, e não tem volta.')) return;
      var a = (await sb.from('trein_aula').select('titulo,video_url')
        .eq('id', id).maybeSingle()).data;
      // `.select()` para saber se APAGOU MESMO. Um delete barrado pela RLS
      // nao devolve erro: volta 204 com zero linhas. Sem conferir, a tela
      // anunciava "Aula removida" sem nada ter acontecido — e o
      // administrador so descobria recarregando.
      var res = await sb.from('trein_aula').delete().eq('id', id).select('id');
      if (res.error) return verCurso('Nao consegui remover: ' + seguro(res.error.message));
      if (!res.data || !res.data.length) {
        return verCurso('Nada foi removido. Isso costuma ser permissao: '
          + 'confira se o seu usuario tem o modulo Treinamentos marcado no '
          + 'SistemaCMH.');
      }
      anotar('trein_aula_removida', atual.codigo + ': ' + ((a && a.titulo) || id));
      if (a && a.video_url) {
        // o mesmo tratamento de caminho usado para ler o video
        var rem = await sb.storage.from('treinamentos')
          .remove([String(a.video_url).replace(/^\/+/, '')]);
        if (rem.error) {
          carregarCursos();
          return verCurso('A aula saiu da lista, mas o arquivo de video '
            + 'continuou no armazenamento: ' + seguro(rem.error.message), true);
        }
      }
      carregarCursos();   // o cartão do curso mostra a contagem de aulas
      verCurso('Aula removida' + (a ? ': ' + seguro(a.titulo) : '') +
               '. O vídeo foi apagado junto.', true);
    }

    async function mover(id, passo, aulas) {
      var i = aulas.findIndex(function (a) { return a.id === id; });
      var j = i + passo;
      if (j < 0 || j >= aulas.length) return;
      // troca a ordem das duas: mexer só numa deixaria duas aulas com o
      // mesmo número, e aí a sequência vira sorteio
      // Os dois updates sao conferidos. Se o primeiro grava e o segundo
      // nao (permissao, rede, aba fechada no meio), as duas aulas ficam
      // com a MESMA ordem — que e exatamente o que este metodo existe
      // para evitar. Falhando, o primeiro e desfeito.
      var p = await sb.from('trein_aula')
        .update({ ordem: aulas[j].ordem }).eq('id', aulas[i].id).select('id');
      if (p.error || !p.data || !p.data.length) {
        return verCurso('Nao consegui reordenar. Recarregue e tente de novo.');
      }
      var q = await sb.from('trein_aula')
        .update({ ordem: aulas[i].ordem }).eq('id', aulas[j].id).select('id');
      if (q.error || !q.data || !q.data.length) {
        await sb.from('trein_aula')
          .update({ ordem: aulas[i].ordem }).eq('id', aulas[i].id);
        return verCurso('Nao consegui reordenar. Nada foi mudado.');
      }
      anotar('trein_aulas_reordenadas',
        atual.codigo + ': ' + aulas[i].titulo + ' ' + (passo < 0 ? 'subiu' : 'desceu'));
      verCurso();
    }

    // ------------------------------------------------------------- início
    sb.auth.getSession().then(function (s) {
      if (s.data.session) abrir();
      else $('viewLogin').style.display = 'block';
    });
  })();
  </script>
</body>
</html>
